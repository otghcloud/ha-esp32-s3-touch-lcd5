esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: "OTGH Cloud.HA Panel LCD5"
    version: "dev"
  on_boot:
    - priority: -200
      then:
        - lambda: id(dashboard).bind_restart([]() { id(panel_restart).press(); });

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      flash_chip: generic

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

ota:
  - platform: esphome

button:
  - platform: restart
    id: panel_restart
    name: Restart
    entity_category: config

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
