esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: "OTGH Cloud.HA Panel LCD5"
    version: "dev"

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      flash_chip: generic

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

ota:
  - platform: esphome

button:
  - platform: restart
    name: Restart
    entity_category: config

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
