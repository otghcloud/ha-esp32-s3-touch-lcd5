esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.11.0
  project:
    name: "OTGH Cloud.HA Panel LCD5"
    version: ${wallpanel_release_version}
  on_boot:
    - priority: -200
      then:
        - lambda: id(dashboard).bind_restart([]() { id(panel_restart).press(); });

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      flash_chip: generic

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

ota:
  - platform: esphome
    on_begin:
      then:
        - lambda: |-
            id(dashboard).begin_update();
            id(ota_backlight_was_on) = id(display_backlight).state;
            id(dashboard_lvgl).set_paused(true, false);
            id(display_idle).cancel_touch();
            if (${ota_blank_display})
              id(display_backlight).turn_off();
    on_error:
      then:
        - script.execute: recover_ota_display
    on_abort:
      then:
        - script.execute: recover_ota_display

script:
  - id: recover_ota_display
    then:
      - lambda: |-
          if (!id(dashboard).updating()) return;
          id(dashboard_lvgl).set_paused(false, false);
          if (id(ota_backlight_was_on))
            id(display_backlight).turn_on();
          else
            id(display_backlight).turn_off();
          id(dashboard).finish_update();
          lv_obj_invalidate(lv_screen_active());
      - homeassistant.event:
          event: esphome.wallpanel_ready
          data:
            endpoint: !lambda |-
              std::string name = App.get_name();
              std::replace(name.begin(), name.end(), '-', '_');
              return "esphome." + name + "_set_dashboard_chunk";

substitutions:
  ota_blank_display: "true"

globals:
  - id: ota_backlight_was_on
    type: bool
    initial_value: 'false'

button:
  - platform: restart
    id: panel_restart
    name: Restart
    entity_category: config

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
