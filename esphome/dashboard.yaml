# Generated from ../config.yaml by scripts/generate_dashboard.py. Do not edit directly.
font:
- file: gfonts://Roboto
  id: font_large
  size: 38
- file: gfonts://Roboto
  id: font_medium
  size: 24
- file: gfonts://Roboto
  id: font_small
  size: 16
image:
- platform: file
  file: mdi:lightbulb
  id: icon_lightbulb
  type: GRAYSCALE
  transparency: alpha_channel
  resize: 72x72
- platform: file
  file: mdi:ceiling-light
  id: icon_ceiling_light
  type: GRAYSCALE
  transparency: alpha_channel
  resize: 72x72
- platform: file
  file: mdi:lightbulb-group-outline
  id: icon_lightbulb_group_outline
  type: GRAYSCALE
  transparency: alpha_channel
  resize: 72x72
- platform: file
  file: mdi:door
  id: icon_door
  type: GRAYSCALE
  transparency: alpha_channel
  resize: 72x72
- platform: file
  file: mdi:robot
  id: icon_robot
  type: GRAYSCALE
  transparency: alpha_channel
  resize: 72x72
lvgl:
  page_wrap: false
  top_layer:
    widgets:
    - label:
        id: lbl_time
        text: --:--
        text_font: font_large
        text_color: 0xF2F4F8
        align: TOP_RIGHT
        x: -24
        y: 4
  pages:
