        x: 20
        y: 65
        width: 360
        height: 155
        bg_color: 0x171F2C
        bg_opa: 90%
        border_color: 0x344154
        border_width: 1
        radius: 18
        on_click:
        - homeassistant.action:
            action: light.toggle
            data:
              entity_id: light.office_lamp
        widgets:
        - image:
            src: icon_lightbulb
            x: 22
            y: 42
            image_recolor: 0xF2C66D
            image_recolor_opa: COVER
        - label:
            text: Lamp
            text_font: font_medium
            text_color: 0xF2F4F8
            x: 112
            y: 30
        - label:
            id: lbl_lamp_state
            text: UNKNOWN
            text_font: font_medium
            text_color: 0xAAB4C5
            x: 112
            y: 78
        - label:
            id: lbl_lamp_unavailable
            text: UNAVAILABLE
            text_font: font_small
            text_color: 0xF2A65A
            align: TOP_RIGHT
