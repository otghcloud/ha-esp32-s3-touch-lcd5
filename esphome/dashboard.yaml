font:
  - file: "gfonts://Roboto"
    id: font_large
    size: 38

  - file: "gfonts://Roboto"
    id: font_medium
    size: 24

  - file: "gfonts://Roboto"
    id: font_small
    size: 16

image:
  - platform: file
    file: "mdi:lightbulb"
    id: icon_lamp
    type: GRAYSCALE
    transparency: alpha_channel
    resize: 72x72

  - platform: file
    file: "mdi:ceiling-light"
    id: icon_ceiling
    type: GRAYSCALE
    transparency: alpha_channel
    resize: 72x72

  - platform: file
    file: "mdi:lightbulb-group-outline"
    id: icon_cupboard
    type: GRAYSCALE
    transparency: alpha_channel
    resize: 72x72

  - platform: file
    file: "mdi:door"
    id: icon_door
    type: GRAYSCALE
    transparency: alpha_channel
    resize: 72x72

lvgl:
  pages:
    - id: main_page
      bg_color: 0x111827
      bg_opa: COVER

      widgets:
        - label:
            text: "Office"
            text_font: font_medium
            text_color: 0xF2F4F8
            align: TOP_LEFT
            x: 24
            y: 10

        - label:
            id: lbl_time
            text: "--:--"
            text_font: font_large
            text_color: 0xF2F4F8
            align: TOP_RIGHT
            x: -24
            y: 4

        - button:
            x: 20
            y: 65
            width: 360
            height: 155
            bg_color: 0x171F2C
            bg_opa: 90%
            border_color: 0x344154
            border_width: 1
            radius: 18

            on_click:
              - homeassistant.action:
                  action: light.toggle
                  data:
                    entity_id: light.office_lamp

            widgets:
              - image:
                  src: icon_lamp
                  x: 22
                  y: 42
                  image_recolor: 0xF2C66D
                  image_recolor_opa: COVER

              - label:
                  text: "Lamp"
                  text_font: font_medium
                  text_color: 0xF2F4F8
                  x: 112
                  y: 30

              - label:
                  id: lbl_lamp_state
                  text: "UNKNOWN"
                  text_font: font_medium
                  text_color: 0xAAB4C5
                  x: 112
                  y: 78

              - label:
                  id: lbl_lamp_unavailable
                  text: "UNAVAILABLE"
                  text_font: font_small
                  text_color: 0xF2A65A
                  align: TOP_RIGHT
                  x: -14
                  y: 10

        - button:
            x: 420
            y: 65
            width: 360
            height: 155
            bg_color: 0x171F2C
            bg_opa: 90%
            border_color: 0x344154
            border_width: 1
            radius: 18

            on_click:
              - homeassistant.action:
                  action: light.toggle
                  data:
                    entity_id: light.office_ceiling

            widgets:
              - image:
                  src: icon_ceiling
                  x: 22
                  y: 42
                  image_recolor: 0xF2C66D
                  image_recolor_opa: COVER

              - label:
                  text: "Ceiling"
                  text_font: font_medium
                  text_color: 0xF2F4F8
                  x: 112
                  y: 30

              - label:
                  id: lbl_ceiling_state
                  text: "UNKNOWN"
                  text_font: font_medium
                  text_color: 0xAAB4C5
                  x: 112
                  y: 78

              - label:
                  id: lbl_ceiling_unavailable
                  text: "UNAVAILABLE"
                  text_font: font_small
                  text_color: 0xF2A65A
                  align: TOP_RIGHT
                  x: -14
                  y: 10

        - button:
            x: 20
            y: 230
            width: 360
            height: 155
            bg_color: 0x171F2C
            bg_opa: 90%
            border_color: 0x344154
            border_width: 1
            radius: 18

            on_click:
              - homeassistant.action:
                  action: light.toggle
                  data:
                    entity_id: light.office_cupboard_light

            widgets:
              - image:
                  src: icon_cupboard
                  x: 22
                  y: 42
                  image_recolor: 0xF2C66D
                  image_recolor_opa: COVER

              - label:
                  text: "Cupboard"
                  text_font: font_medium
                  text_color: 0xF2F4F8
                  x: 112
                  y: 30

              - label:
                  id: lbl_cupboard_state
                  text: "UNKNOWN"
                  text_font: font_medium
                  text_color: 0xAAB4C5
                  x: 112
                  y: 78

              - label:
                  id: lbl_cupboard_unavailable
                  text: "UNAVAILABLE"
                  text_font: font_small
                  text_color: 0xF2A65A
                  align: TOP_RIGHT
                  x: -14
                  y: 10

        - button:
            x: 420
            y: 230
            width: 360
            height: 155
            bg_color: 0x171F2C
            bg_opa: 90%
            border_color: 0x344154
            border_width: 1
            radius: 18

            on_click:
              - if:
                  condition:
                    lambda: |-
                      return id(door_raw).state == "locked";
                  then:
                    - homeassistant.action:
                        action: lock.unlock
                        data:
                          entity_id: lock.office_office_door
                  else:
                    - homeassistant.action:
                        action: lock.lock
                        data:
                          entity_id: lock.office_office_door

            widgets:
              - image:
                  src: icon_door
                  x: 22
                  y: 42
                  image_recolor: 0xF2C66D
                  image_recolor_opa: COVER

              - label:
                  text: "Door"
                  text_font: font_medium
                  text_color: 0xF2F4F8
                  x: 112
                  y: 30

              - label:
                  id: lbl_door_state
                  text: "UNKNOWN"
                  text_font: font_medium
                  text_color: 0xAAB4C5
                  x: 112
                  y: 78

              - label:
                  id: lbl_door_unavailable
                  text: "UNAVAILABLE"
                  text_font: font_small
                  text_color: 0xF2A65A
                  align: TOP_RIGHT
                  x: -14
                  y: 10

        - label:
            id: lbl_temp
            text: "Temperature: --.- C"
            text_font: font_small
            text_color: 0xB9C2D0
            align: BOTTOM_LEFT
            x: 24
            y: -14
