esphome:
  on_boot:
    - priority: -200
      then:
        - lambda: id(dashboard).bind_clock([]() { id(update_clock).execute(); });

time:
  - platform: homeassistant
    id: homeassistant_time
    on_time_sync:
      then:
        - script.execute: update_clock

script:
  - id: update_clock
    then:
      - lambda: |-
          lv_obj_set_style_text_font(id(lbl_time),
                                    id(dashboard).localization().twelve_hour ? id(font_medium) : id(font_large), 0);
          lv_obj_set_y(id(lbl_time), id(dashboard).localization().twelve_hour ? 14 : 4);
          wallpanel::update_clock(id(homeassistant_time).now(), id(lbl_time),
                                 id(screensaver_clock), id(screensaver_date), id(dashboard).localization());

interval:
  - interval: 30s
    then:
      - script.execute: update_clock
