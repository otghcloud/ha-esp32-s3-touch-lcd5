esphome:
  on_boot:
    - priority: -200
      then:
        - lambda: id(dashboard).bind_clock([]() { id(update_clock).execute(); });

time:
  - platform: homeassistant
    id: homeassistant_time
    on_time_sync:
      then:
        - script.execute: update_clock

script:
  - id: update_clock
    then:
      - lambda: |-
          if (id(dashboard).updating()) return;
          wallpanel::update_clock(id(homeassistant_time).now(), id(lbl_time),
                                 id(screensaver_clock), id(screensaver_date), id(dashboard).localization());

interval:
  - interval: 30s
    then:
      - script.execute: update_clock
