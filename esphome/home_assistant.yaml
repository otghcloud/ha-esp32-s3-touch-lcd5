time:
  - platform: homeassistant
    id: homeassistant_time
    on_time_sync:
      then:
        - script.execute: update_clock

script:
  - id: update_clock
    then:
      - lambda: |-
          wallpanel::update_clock(id(homeassistant_time).now(), id(lbl_time),
                                 id(screensaver_clock), id(screensaver_date));

interval:
  - interval: 30s
    then:
      - script.execute: update_clock
