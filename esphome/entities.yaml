# Generated from ../config.yaml by scripts/generate_dashboard.py. Do not edit directly.
sensor:
- platform: homeassistant
  id: ha_temperature_office
  entity_id: sensor.office_nspanel_temperature
  on_value:
    then:
    - lvgl.label.update:
        id: lbl_temperature_office
        text:
          format: 'Temperature: %.1f C'
          args:
          - x
- platform: homeassistant
  id: ha_temperature_landing
  entity_id: sensor.landing_nspanel_temperature
  on_value:
    then:
    - lvgl.label.update:
        id: lbl_temperature_landing
        text:
          format: 'Temperature: %.1f C'
          args:
          - x
text_sensor:
- platform: homeassistant
  id: ha_lamp_state
  entity_id: light.office_lamp
  on_value:
    then:
    - if:
        condition:
          lambda: return x == "unknown" || x == "unavailable";
        then:
        - lvgl.widget.show:
            id: lbl_lamp_unavailable
        else:
        - lvgl.widget.hide:
            id: lbl_lamp_unavailable
        - if:
            condition:
              lambda: return x == "on";
            then:
            - lvgl.label.update:
                id: lbl_lamp_state
                text: 'ON'
                text_color: 0xFFD166
            else:
            - lvgl.label.update:
                id: lbl_lamp_state
                text: 'OFF'
                text_color: 0xAAB4C5
