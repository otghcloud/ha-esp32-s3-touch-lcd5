i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true

esphome:
  on_boot:
    - priority: -200
      then:
        - lambda: |-
            id(dashboard).bind_power(
              []() {
                id(display_idle).activity(millis());
                id(display_backlight).turn_on();
                if (id(dashboard).screensaver_active())
                  id(dashboard).wake();
              },
              []() { id(display_backlight).turn_off(); },
              []() { id(display_idle).activity(millis()); });

# Enabling the output bank also requires driving the EXIO1/EXIO3 reset lines.
ch422g:
  - id: io_expander

globals:
  - id: display_idle
    type: wallpanel::DisplayIdle
    restore_value: false

number:
  - platform: template
    id: screensaver_time
    name: Screensaver time
    icon: mdi:monitor-screenshot
    entity_category: config
    unit_of_measurement: s
    mode: BOX
    min_value: 0
    max_value: 86400
    step: 1
    initial_value: 60
    restore_value: true
    optimistic: true
    update_interval: never
    on_value:
      then:
        - lambda: |-
            id(display_idle).activity(millis());
            id(dashboard).set_screensaver_time(static_cast<uint32_t>(x));
  - platform: template
    id: display_timeout
    name: Display timeout
    icon: mdi:timer-outline
    entity_category: config
    unit_of_measurement: s
    mode: BOX
    min_value: 0
    max_value: 86400
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true
    update_interval: never
    on_value:
      then:
        - lambda: id(display_idle).set_timeout(static_cast<uint32_t>(x), millis());

switch:
  - platform: gpio
    id: display_backlight
    name: Display backlight
    icon: mdi:monitor
    entity_category: config
    restore_mode: ALWAYS_ON
    on_turn_on:
      then:
        - lambda: |-
            id(display_idle).activity(millis());
            id(dashboard).backlight_on();
    on_turn_off:
      then:
        - lambda: |-
            id(display_idle).cancel_touch();
            id(dashboard).backlight_off();
    pin:
      ch422g: io_expander
      number: 2
      mode: OUTPUT
      inverted: false

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (id(display_backlight).state && !id(dashboard).sensor_hold()) {
            if (id(display_idle).expired(millis()))
              id(dashboard).sleep(true);
            else
              id(dashboard).check_screensaver(id(display_idle), millis());
          }

touchscreen:
  - platform: gt911
    id: touch
    interrupt_pin: GPIO4
    reset_pin:
      ch422g: io_expander
      number: 1
      mode: OUTPUT
    on_touch:
      then:
        - lambda: |-
            const bool saver = id(dashboard).screensaver_active();
            const bool accept = id(display_idle).begin_touch(id(display_backlight).state && !saver, millis());
            id(dashboard).touch_activity();
            id(display_backlight).turn_on();
            if (id(dashboard).screensaver_active())
              id(dashboard).wake();
            if (!accept)
              return;
            id(dashboard).begin_touch(touch.id, touch.x, touch.y);
            for (const auto &point : touches) {
              if (point.state != 0)
                id(dashboard).update_touch(point.id, point.x, point.y);
            }
    on_update:
      then:
        - lambda: |-
            if (!id(display_idle).accepts_touch())
              return;
            for (const auto &point : touches) {
              if (point.state != 0)
                id(dashboard).update_touch(point.id, point.x, point.y);
            }
    on_release:
      then:
        - lambda: |-
            if (id(display_idle).end_touch(millis()))
              id(dashboard).end_touch();

display:
  - platform: mipi_rgb
    model: RPI
    id: lcd
    update_interval: never
    auto_clear_enabled: false
    byte_order: big_endian
    reset_pin:
      ch422g: io_expander
      number: 3
      mode: OUTPUT

    dimensions:
      width: 800
      height: 480

    # Preserve the legacy driver's BGR data-bit mapping.
    data_pins:
      - GPIO48
      - GPIO47
      - GPIO21
      - GPIO14
      - GPIO38
      - GPIO18
      - GPIO17
      - GPIO10
      - GPIO1
      - GPIO2
      - GPIO42
      - GPIO41
      - GPIO40
      - GPIO39
      - GPIO0
      - GPIO45

    de_pin: GPIO5
    pclk_pin: GPIO7
    hsync_pin:
      number: GPIO46
      ignore_strapping_warning: true
    vsync_pin:
      number: GPIO3
      ignore_strapping_warning: true

    pclk_frequency: 16MHz
    pclk_inverted: true

    hsync_pulse_width: 4
    hsync_front_porch: 8
    hsync_back_porch: 8

    vsync_pulse_width: 4
    vsync_front_porch: 8
    vsync_back_porch: 8
