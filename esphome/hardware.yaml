i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true

# Enabling the output bank also requires driving the EXIO1/EXIO3 reset lines.
ch422g:
  - id: io_expander

switch:
  - platform: gpio
    id: display_backlight
    name: Display backlight
    icon: mdi:monitor
    entity_category: config
    restore_mode: ALWAYS_ON
    pin:
      ch422g: io_expander
      number: 2
      mode: OUTPUT
      inverted: false

touchscreen:
  - platform: gt911
    id: touch
    interrupt_pin: GPIO4
    reset_pin:
      ch422g: io_expander
      number: 1
      mode: OUTPUT
    on_touch:
      then:
        - lambda: |-
            id(dashboard).begin_touch(touch.id, touch.x, touch.y);
            for (const auto &point : touches) {
              if (point.state != 0)
                id(dashboard).update_touch(point.id, point.x, point.y);
            }
    on_update:
      then:
        - lambda: |-
            for (const auto &point : touches) {
              if (point.state != 0)
                id(dashboard).update_touch(point.id, point.x, point.y);
            }
    on_release:
      then:
        - lambda: id(dashboard).end_touch();

display:
  - platform: mipi_rgb
    model: RPI
    id: lcd
    update_interval: never
    auto_clear_enabled: false
    byte_order: big_endian
    reset_pin:
      ch422g: io_expander
      number: 3
      mode: OUTPUT

    dimensions:
      width: 800
      height: 480

    # Preserve the legacy driver's BGR data-bit mapping.
    data_pins:
      - GPIO48
      - GPIO47
      - GPIO21
      - GPIO14
      - GPIO38
      - GPIO18
      - GPIO17
      - GPIO10
      - GPIO1
      - GPIO2
      - GPIO42
      - GPIO41
      - GPIO40
      - GPIO39
      - GPIO0
      - GPIO45

    de_pin: GPIO5
    pclk_pin: GPIO7
    hsync_pin:
      number: GPIO46
      ignore_strapping_warning: true
    vsync_pin:
      number: GPIO3
      ignore_strapping_warning: true

    pclk_frequency: 16MHz
    pclk_inverted: true

    hsync_pulse_width: 4
    hsync_front_porch: 8
    hsync_back_porch: 8

    vsync_pulse_width: 4
    vsync_front_porch: 8
    vsync_back_porch: 8
