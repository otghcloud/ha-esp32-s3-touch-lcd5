packages:
  wallpanel_version: !include project_version.yaml

substitutions:
  wallpanel_component_source: github://otghcloud/ha-esp32-s3-touch-lcd5@v${wallpanel_release_version}

external_components:
  - source: ${wallpanel_component_source}
    refresh: 300s
    components: [wallpanel]

wallpanel:
  id: dashboard

esphome:
  on_boot:
    - priority: -200
      then:
        - lambda: id(dashboard_endpoint).update();
        - lambda: id(firmware_release).update();

select:
  - platform: template
    id: wake_up_page
    name: Wake-up page
    icon: mdi:page-first
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: Last used page
    options:
      - Last used page
      - Page 1
      - Page 2
      - Page 3
      - Page 4
      - Page 5
      - Page 6
      - Page 7
      - Page 8
      - Navigation / menu
      - Homepage
    on_value:
      then:
        - lambda: id(dashboard).set_wake_page(i);

api:
  homeassistant_services: true
  actions:
    - action: wake_display
      then:
        - lambda: id(dashboard).sensor_wake();
    - action: set_dashboard_chunk
      variables:
        transfer: string
        index: int
        total: int
        payload: string
      then:
        - lambda: id(dashboard).receive_chunk(transfer, index, total, payload);
  on_client_connected:
    then:
      - delay: 2s
      - homeassistant.event:
          event: esphome.wallpanel_ready
          data:
            endpoint: !lambda |-
              std::string name = App.get_name();
              std::replace(name.begin(), name.end(), '-', '_');
              return "esphome." + name + "_set_dashboard_chunk";

text_sensor:
  - platform: template
    name: Firmware release
    id: firmware_release
    entity_category: diagnostic
    update_interval: never
    lambda: return std::string("wallpanel/") + wallpanel::PROJECT_VERSION;
  - platform: template
    name: Release status
    id: release_status_sensor
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      const auto status = id(dashboard).release_status();
      if (!id(release_status_sensor).has_state() || status != id(release_status_sensor).state)
        return status;
      return {};
  - platform: template
    name: Dashboard endpoint
    id: dashboard_endpoint
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      std::string name = App.get_name();
      std::replace(name.begin(), name.end(), '-', '_');
      return "esphome." + name + "_set_dashboard_chunk";

script:
  - id: dashboard_next
    then:
      - lambda: id(dashboard).navigate(1);
  - id: dashboard_previous
    then:
      - lambda: id(dashboard).navigate(-1);

interval:
  - interval: 1s
    then:
      - lambda: id(dashboard).check_connection();
