substitutions:
  wallpanel_component_source: github://otghcloud/ha-esp32-s3-touch-lcd5@main

external_components:
  - source: ${wallpanel_component_source}
    refresh: 300s
    components: [wallpanel]

wallpanel:
  id: dashboard

select:
  - platform: template
    id: wake_up_page
    name: Wake-up page
    icon: mdi:page-first
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: Last used page
    options:
      - Last used page
      - Page 1
      - Page 2
      - Page 3
      - Page 4
      - Page 5
      - Page 6
    on_value:
      then:
        - lambda: id(dashboard).set_wake_page(i);

api:
  homeassistant_services: true
  actions:
    - action: set_dashboard
      variables:
        payload: string
      then:
        - lambda: id(dashboard).receive(payload);
    - action: set_dashboard_chunk
      variables:
        transfer: string
        index: int
        total: int
        payload: string
      then:
        - lambda: id(dashboard).receive_chunk(transfer, index, total, payload);
  on_client_connected:
    then:
      - delay: 2s
      - homeassistant.event:
          event: esphome.wallpanel_ready
          data:
            endpoint: !lambda |-
              std::string name = App.get_name();
              std::replace(name.begin(), name.end(), '-', '_');
              return "esphome." + name + "_set_dashboard";

text_sensor:
  - platform: template
    name: Dashboard endpoint
    id: dashboard_endpoint
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      std::string name = App.get_name();
      std::replace(name.begin(), name.end(), '-', '_');
      return "esphome." + name + "_set_dashboard";

script:
  - id: dashboard_next
    then:
      - lambda: id(dashboard).navigate(1);
  - id: dashboard_previous
    then:
      - lambda: id(dashboard).navigate(-1);

interval:
  - interval: 1s
    then:
      - lambda: id(dashboard).check_connection();
