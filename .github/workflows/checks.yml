name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ""
      release_version:
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.release_version }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"
  IDF_PY_BUILD_JOBS: "2"

jobs:
  validate:
    name: Metadata and tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, ubuntu-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Validate PR title and new commit messages
        if: contains(fromJSON('["pull_request", "push", "merge_group"]'), github.event_name)
        run: python scripts/release.py commits --event "$GITHUB_EVENT_PATH"
      - name: Generate the release version under test
        if: inputs.release_version != ''
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          python scripts/release.py sync --version "$RELEASE_VERSION"
          git add -- VERSION esphome/project_version.yaml esphome/components/wallpanel/release_version.h wallpanel_blueprint.yaml
      - run: python scripts/release.py check
      - run: python scripts/generate_dashboard.py --check
      - name: Install pinned actionlint
        shell: bash
        run: |
          version=1.7.12
          case "$RUNNER_ARCH" in
            X64)
              arch=amd64
              checksum=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
              ;;
            ARM64)
              arch=arm64
              checksum=325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6
              ;;
            *) echo "::error::Unsupported runner architecture: $RUNNER_ARCH"; exit 1 ;;
          esac
          install_dir="$RUNNER_TEMP/wallpanel-actionlint-$GITHUB_RUN_ID-$GITHUB_JOB"
          mkdir -p "$install_dir"
          archive="$install_dir/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v$version/actionlint_${version}_linux_${arch}.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$install_dir" actionlint
          echo "$install_dir" >> "$GITHUB_PATH"
      - run: actionlint -color
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: ruff check --select E9,F63,F7,F82 --exclude .esphome scripts esphome/components
      - run: yamllint .github .yamllint.yml ha-esp32-s3-touch-lcd5.yaml wallpanel_blueprint.yaml esphome/*.yaml home_assistant/*.yaml scripts/runtime_tests/runtime.yaml
      - run: git diff --exit-code

  native:
    name: LVGL and native API
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, ubuntu-latest]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Generate the release version under test
        if: inputs.release_version != ''
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: python scripts/release.py sync --version "$RELEASE_VERSION"
      - run: esphome compile scripts/runtime_tests/runtime.yaml
      - run: python scripts/runtime_tests/check_native_api.py

  firmware:
    name: ESP32 firmware
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, ubuntu-latest]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Generate the release version under test
        if: inputs.release_version != ''
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: python scripts/release.py sync --version "$RELEASE_VERSION"
      - run: esphome compile .github/firmware.yaml
      - name: Collect validation images
        run: |
          mkdir -p build/validation
          cp .github/.esphome/build/wallpanel-ci/build/firmware*.bin build/validation/
          cp esphome/components/wallpanel/MDI-LICENSE build/validation/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-firmware-${{ github.sha }}
          path: build/validation/
          if-no-files-found: error
          retention-days: 7

  required:
    name: Required checks
    if: always()
    needs: [validate, native, firmware]
    runs-on: [self-hosted, ubuntu-latest]
    timeout-minutes: 5
    steps:
      - name: Require every validation job to pass
        env:
          VALIDATE: ${{ needs.validate.result }}
          NATIVE: ${{ needs.native.result }}
          FIRMWARE: ${{ needs.firmware.result }}
        run: |
          test "$VALIDATE" = success
          test "$NATIVE" = success
          test "$FIRMWARE" = success
