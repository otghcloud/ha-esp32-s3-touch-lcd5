substitutions:
  wallpanel_component_source: ../../esphome/components

esphome:
  name: dynamic-host
  on_boot:
    priority: -101
    then:
      - lambda: |-
          auto require = [](bool value, const char *message) {
            if (!value) {
              ESP_LOGE("runtime_test", "FAILED: %s", message);
              std::exit(1);
            }
          };
          auto hidden = [](lv_obj_t *obj) { return lv_obj_has_flag(obj, LV_OBJ_FLAG_HIDDEN); };
          wallpanel::DisplayIdle idle;
          require(!idle.expired(100000), "default display timeout is disabled");
          idle.set_timeout(2, 100);
          require(!idle.expired(2099) && idle.expired(2100), "display timeout boundary in seconds");
          idle.activity(2100);
          require(!idle.expired(4099) && idle.expired(4100), "manual backlight on restarts timeout");
          require(!idle.begin_touch(false, 4200), "dark-screen touch is wake-only");
          require(!idle.begin_touch(true, 4201) && !idle.accepts_touch(),
                  "additional fingers cannot turn a wake gesture into an action");
          require(!idle.expired(10000), "held wake touch prevents timeout");
          require(!idle.end_touch(10000), "wake release cannot activate a button or swipe");
          require(!idle.expired(11999) && idle.expired(12000), "timeout starts on wake release");
          require(idle.begin_touch(true, 12100) && idle.accepts_touch(), "second touch operates normally");
          require(!idle.expired(20000), "held normal touch prevents timeout");
          require(idle.end_touch(20000), "normal release is forwarded");
          require(!idle.end_touch(20001), "duplicate release cannot activate controls");
          idle.begin_touch(true, 21000);
          idle.cancel_touch();
          require(!idle.accepts_touch() && !idle.end_touch(21100), "manual off cancels an active gesture");
          idle.set_timeout(1, UINT32_MAX - 500);
          require(!idle.expired(498) && idle.expired(499), "display timeout handles millis rollover");
          idle.set_timeout(10, 0);
          idle.set_timeout(1, 20000);
          require(!idle.expired(20999) && idle.expired(21000), "setting timeout restarts countdown");
          idle.set_timeout(86400, 0);
          require(!idle.expired(86399999) && idle.expired(86400000), "maximum display timeout is 24 hours");
          idle.set_timeout(0, 0);
          require(!idle.expired(UINT32_MAX), "zero disables automatic backlight off");
          wallpanel::TouchGesture gesture;
          using TouchAction = wallpanel::TouchAction;
          gesture.begin(1, 300, 150);
          gesture.update(1, 320, 150);
          require(gesture.finish() == TouchAction::TAP, "20 pixel tap tolerance");
          require(gesture.finish() == TouchAction::NONE, "release consumed once");
          gesture.begin(1, 300, 150);
          gesture.update(1, 321, 150);
          gesture.update(1, 300, 150);
          require(gesture.finish() == TouchAction::NONE, "drag returning to origin is not a tap");
          gesture.begin(1, 300, 150);
          gesture.update(1, 201, 150);
          require(gesture.finish() == TouchAction::NONE, "sub-threshold swipe is not a tap");
          gesture.begin(1, 300, 150);
          gesture.update(1, 200, 150);
          require(gesture.finish() == TouchAction::NEXT, "100 pixel left swipe");
          gesture.begin(1, 300, 150);
          gesture.update(1, 400, 150);
          require(gesture.finish() == TouchAction::PREVIOUS, "100 pixel right swipe");
          gesture.begin(1, 300, 150);
          gesture.update(1, 450, 350);
          require(gesture.finish() == TouchAction::NONE, "vertical drag cannot activate button or swipe");
          gesture.begin(1, 300, 150);
          gesture.update(2, 450, 150);
          require(gesture.finish() == TouchAction::NONE, "multi-touch cannot activate controls");
          require(!hidden(id(dashboard_waiting)), "waiting on reboot");
          auto check_background = [&]() {
            id(test_lcd).sample_pixel = esphome::Color(255, 0, 0);
            lv_obj_invalidate(lv_screen_active());
            lv_refr_now(nullptr);
            auto actual = id(test_lcd).sample_pixel;
            auto expected = id(dashboard_background)->get_pixel(5, 400);
            require(actual.r == expected.r && actual.g == expected.g && actual.b == expected.b,
                    "background image rendered at expected position");
          };
          check_background();
          for (auto *page : {id(page_0), id(page_1), id(page_2), id(page_3)}) {
            lv_obj_remove_flag(page, LV_OBJ_FLAG_HIDDEN);
            check_background();
            lv_obj_add_flag(page, LV_OBJ_FLAG_HIDDEN);
          }
          auto snapshot = [](int mode) {
            return esphome::json::build_json([mode](JsonObject root) {
              root["version"] = 1;
              JsonArray pages = root["pages"].to<JsonArray>();
              for (int p = 0; p < (mode == 4 ? 5 : 4); p++) {
                JsonObject page = pages.add<JsonObject>();
                page["title"] = p == 0 ? "Office" : "Landing";
                page["temperature"] = p == 2 ? "Temperature: 21.5 C" : "";
                JsonArray buttons = page["buttons"].to<JsonArray>();
                for (int b = 0; b < (mode == 10 ? 5 : 4); b++) {
                  JsonObject button = buttons.add<JsonObject>();
                  bool populated = mode != 3 && ((p == 0 && b == 0 && mode != 2) || (p == 2 && b == 3));
                  button["entity"] = populated ? (mode == 5 ? "cover.invalid" : mode == 6 ? "automation.test"
                    : mode == 7 || mode == 9 ? "lock.test" : mode == 8 ? "switch.test" : "light.test") : "";
                  button["name"] = populated ? "Test Light" : "";
                  button["state"] = populated ? (mode == 1 ? "unavailable" : mode == 7 ? "locked"
                    : mode == 9 ? "unlocked" : mode == 8 ? "off" : "on") : "";
                  if (mode >= 11 && populated)
                    button["icon"] = mode == 11 ? "mdi:lightbulb-auto" : mode == 12 ? "mdi:door-open"
                      : mode == 13 ? "mdi:does-not-exist" : mode == 14 ? "custom:icon" : "";
                  if (mode == 15 && populated)
                    button["icon"] = 123;
                }
              }
            });
          };
          id(dashboard).receive(snapshot(0));
          require(!hidden(id(page_0)) && hidden(id(page_2)), "first nonempty page shown");
          require(hidden(id(page_1)) && hidden(id(page_3)), "empty pages hidden");
          require(!hidden(id(dot_0_0)) && !hidden(id(dot_0_1)) && hidden(id(dot_0_2)), "two visible page dots");
          require(std::string(lv_label_get_text(id(button_0_0_state))) == "ON", "light state");
          auto icon_is = [](lv_obj_t *widget, const char *name) {
            const auto glyph = wallpanel::mdi_glyph(name);
            return glyph != nullptr && std::string(lv_label_get_text(widget)) == glyph;
          };
          require(icon_is(id(button_0_0_icon), "mdi:lightbulb"), "legacy snapshot uses HA light default");
          for (const auto &icon : wallpanel::MDI_ICONS) {
            require(wallpanel::mdi_glyph(std::string("mdi:") + icon.name) == icon.glyph,
                    "every MDI name is resolvable");
          }
          require(id(font_icons)->get_glyphs().size() == std::size(wallpanel::MDI_ICONS),
                  "full MDI catalogue included in font");
          for (const auto &glyph : id(font_icons)->get_glyphs()) {
            lv_font_glyph_dsc_t descriptor{};
            require(lv_font_get_glyph_dsc(lv_obj_get_style_text_font(id(button_0_0_icon), LV_PART_MAIN),
                    &descriptor, glyph.code_point, 0),
                    "every MDI glyph exists in the compiled font");
          }
          require(!lv_obj_has_state(id(button_0_0), LV_STATE_DISABLED), "available control enabled");
          id(dashboard).navigate(1);
          require(hidden(id(page_0)) && !hidden(id(page_2)), "swipe skips empty page");
          require(lv_obj_get_style_bg_opa(id(dot_2_1), LV_PART_MAIN) == LV_OPA_COVER &&
                  lv_obj_get_style_bg_opa(id(dot_2_0), LV_PART_MAIN) == LV_OPA_TRANSP, "current page dot highlighted");
          require(std::string(lv_label_get_text(id(temperature_2))) == "Temperature: 21.5 C", "dynamic temperature");
          id(dashboard).navigate(1);
          require(!hidden(id(page_0)), "next wraps from last page to first");
          id(dashboard).navigate(-1);
          require(!hidden(id(page_2)), "previous wraps from first page to last");
          id(dashboard).navigate(-1);
          require(!hidden(id(page_0)), "previous page skips empty slots");
          id(dashboard).begin_touch(1, 300, 150);
          id(dashboard).update_touch(1, 180, 150);
          require(!hidden(id(page_0)), "swipe over button waits for release");
          require(id(dashboard).end_touch() == TouchAction::NEXT && !hidden(id(page_2)),
                  "swipe over button changes page, not a tap");
          require(id(dashboard).end_touch() == TouchAction::NONE && !hidden(id(page_2)),
                  "swipe only changes page once");
          id(dashboard).navigate(-1);
          id(dashboard).receive(snapshot(1));
          require(std::string(lv_label_get_text(id(button_0_0_state))) == "ON", "last known appearance retained");
          require(icon_is(id(button_0_0_icon), "mdi:lightbulb"), "unavailable light retains its icon");
          require(lv_obj_has_state(id(button_0_0), LV_STATE_DISABLED), "unavailable entity disabled");
          id(dashboard).receive(snapshot(0));
          id(dashboard).check_connection();
          require(lv_obj_has_state(id(button_0_0), LV_STATE_DISABLED), "disconnection disables controls");
          require(!hidden(id(dashboard_connection)), "offline indicator");
          id(dashboard).receive(snapshot(2));
          require(hidden(id(page_0)) && !hidden(id(page_2)), "removed selected page falls back");
          require(hidden(id(dot_2_0)) && hidden(id(dot_2_1)), "single page has no dots");
          id(dashboard).navigate(1);
          id(dashboard).navigate(-1);
          require(!hidden(id(page_2)), "single-page wrapping stays on its page");
          id(dashboard).receive(snapshot(4));
          require(hidden(id(page_0)) && !hidden(id(page_2)), "reject fifth page atomically");
          id(dashboard).receive(snapshot(5));
          require(hidden(id(page_0)) && !hidden(id(page_2)), "reject unsupported domain atomically");
          id(dashboard).receive(snapshot(10));
          require(hidden(id(page_0)) && !hidden(id(page_2)), "reject fifth button atomically");
          id(dashboard).receive("{bad json");
          require(!hidden(id(page_2)), "reject invalid JSON without replacing layout");
          for (auto entry : {std::pair<int, const char *>{6, "ENABLED"}, {7, "LOCKED"}, {8, "OFF"}, {9, "UNLOCKED"}}) {
            id(dashboard).receive(snapshot(entry.first));
            require(std::string(lv_label_get_text(id(button_2_3_state))) == entry.second, "domain-specific state");
          }
          require(icon_is(id(button_2_3_icon), "mdi:lock-open-variant"), "unlocked HA default");
          id(dashboard).receive(snapshot(7));
          require(icon_is(id(button_2_3_icon), "mdi:lock"), "locked HA default");
          id(dashboard).receive(snapshot(8));
          require(icon_is(id(button_2_3_icon), "mdi:toggle-switch-variant-off"), "switch off default");
          id(dashboard).receive(snapshot(11));
          require(icon_is(id(button_2_3_icon), "mdi:lightbulb-auto"), "HA custom automation icon");
          id(dashboard).receive(snapshot(12));
          require(icon_is(id(button_2_3_icon), "mdi:door-open"), "HA custom door icon");
          id(dashboard).receive(snapshot(15));
          require(icon_is(id(button_2_3_icon), "mdi:door-open"), "invalid icon type rejects snapshot atomically");
          for (int mode : {13, 14, 16}) {
            id(dashboard).receive(snapshot(mode));
            require(icon_is(id(button_2_3_icon), "mdi:lightbulb"), "unsupported or cleared icon uses default");
          }
          auto state_snapshot = [&](const char *entity, const char *state) {
            return esphome::json::build_json([&](JsonObject root) {
              esphome::json::parse_json(snapshot(0), [&](JsonObject source) {
                root.set(source);
                root["pages"][2]["buttons"][3]["entity"] = entity;
                root["pages"][2]["buttons"][3]["state"] = state;
                return true;
              });
            });
          };
          for (auto entry : {std::pair<const char *, const char *>{"off", "mdi:lightbulb-off"},
                              {"on", "mdi:lightbulb"}}) {
            id(dashboard).receive(state_snapshot("light.test", entry.first));
            require(icon_is(id(button_2_3_icon), entry.second), "light icon follows on/off state");
          }
          id(dashboard).receive(state_snapshot("automation.test", "off"));
          require(icon_is(id(button_2_3_icon), "mdi:robot-off"), "automation off default");
          id(dashboard).receive(state_snapshot("automation.test", "unavailable"));
          require(icon_is(id(button_2_3_icon), "mdi:robot-off"), "unavailable automation retains its icon");
          id(dashboard).receive(state_snapshot("lock.test", "unavailable"));
          require(icon_is(id(button_2_3_icon), "mdi:lock"), "changed unavailable entity resets prior icon");
          for (auto entry : {std::pair<const char *, const char *>{"locking", "mdi:lock-clock"},
                              {"jammed", "mdi:lock-alert"}, {"open", "mdi:lock-open-variant"}}) {
            id(dashboard).receive(state_snapshot("lock.test", entry.first));
            require(icon_is(id(button_2_3_icon), entry.second), "lock transition icon");
            require(lv_obj_has_state(id(button_2_3), LV_STATE_DISABLED), "lock transition stays non-actionable");
          }
          id(dashboard).receive(snapshot(3));
          id(dashboard).navigate(1);
          id(dashboard).navigate(-1);
          require(!hidden(id(dashboard_waiting)) && hidden(id(page_2)), "all pages cleared");
          ESP_LOGI("runtime_test", "All runtime dashboard assertions passed");
          std::exit(0);

host:
logger:
api:
  port: 16053
packages:
  dashboard: !include ../../esphome/dashboard.yaml
  dynamic: !include ../../esphome/dynamic.yaml
external_components:
  - source:
      type: local
      path: test_components
    components: [test_display]
test_display:
  id: test_lcd
  auto_clear_enabled: false
  update_interval: never
