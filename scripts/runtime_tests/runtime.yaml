substitutions:
  wallpanel_component_source: ../../esphome/components

esphome:
  name: dynamic-host
  on_boot:
    priority: -101
    then:
      - lambda: |-
          auto require = [](bool value, const char *message) {
            if (!value) {
              ESP_LOGE("runtime_test", "FAILED: %s", message);
              std::exit(1);
            }
          };
          auto hidden = [](lv_obj_t *obj) { return lv_obj_has_flag(obj, LV_OBJ_FLAG_HIDDEN); };
          ESP_LOGI("runtime_test", "Startup LVGL refresh requests: %u",
                   unsigned(id(test_lcd).startup_refresh_requests));
          require(id(test_lcd).startup_refresh_requests < 1500,
                  "resolution/theme setup stays within the bounded refresh workload");
          auto count_objects = [&](auto &&self, lv_obj_t *object) -> size_t {
            size_t count = 1;
            for (uint32_t child = 0; child < lv_obj_get_child_count(object); child++)
              count += self(self, lv_obj_get_child(object, child));
            return count;
          };
          require(count_objects(count_objects, lv_screen_active()) +
                  count_objects(count_objects, lv_layer_top()) < 220,
                  "page models share one control tree rather than duplicating LVGL tiles");
          wallpanel::DisplayIdle idle;
          require(!idle.expired(100000), "default display timeout is disabled");
          idle.set_timeout(2, 100);
          require(!idle.expired(2099) && idle.expired(2100), "display timeout boundary in seconds");
          idle.activity(2100);
          require(!idle.expired(4099) && idle.expired(4100), "manual backlight on restarts timeout");
          require(!idle.begin_touch(false, 4200), "dark-screen touch is wake-only");
          require(!idle.begin_touch(true, 4201) && !idle.accepts_touch(),
                  "additional fingers cannot turn a wake gesture into an action");
          require(!idle.expired(10000), "held wake touch prevents timeout");
          require(!idle.end_touch(10000), "wake release cannot activate a button or swipe");
          require(!idle.expired(11999) && idle.expired(12000), "timeout starts on wake release");
          require(idle.begin_touch(true, 12100) && idle.accepts_touch(), "second touch operates normally");
          require(!idle.expired(20000), "held normal touch prevents timeout");
          require(idle.end_touch(20000), "normal release is forwarded");
          require(!idle.end_touch(20001), "duplicate release cannot activate controls");
          idle.begin_touch(true, 21000);
          idle.cancel_touch();
          require(!idle.accepts_touch() && !idle.end_touch(21100), "manual off cancels an active gesture");
          idle.set_timeout(1, UINT32_MAX - 500);
          require(!idle.expired(498) && idle.expired(499), "display timeout handles millis rollover");
          idle.set_timeout(10, 0);
          idle.set_timeout(1, 20000);
          require(!idle.expired(20999) && idle.expired(21000), "setting timeout restarts countdown");
          idle.set_timeout(86400, 0);
          require(!idle.expired(86399999) && idle.expired(86400000), "maximum display timeout is 24 hours");
          idle.set_timeout(0, 0);
          require(!idle.expired(UINT32_MAX), "zero disables automatic backlight off");
          wallpanel::TouchGesture gesture;
          using TouchAction = wallpanel::TouchAction;
          gesture.begin(1, 300, 150);
          gesture.update(1, 320, 150);
          require(gesture.finish() == TouchAction::TAP, "20 pixel tap tolerance");
          require(gesture.finish() == TouchAction::NONE, "release consumed once");
          gesture.begin(1, 300, 150);
          gesture.update(1, 321, 150);
          gesture.update(1, 300, 150);
          require(gesture.finish() == TouchAction::NONE, "drag returning to origin is not a tap");
          gesture.begin(1, 300, 150);
          gesture.update(1, 201, 150);
          require(gesture.finish() == TouchAction::NONE, "sub-threshold swipe is not a tap");
          gesture.begin(1, 300, 150);
          gesture.update(1, 200, 150);
          require(gesture.finish() == TouchAction::NEXT, "100 pixel left swipe");
          gesture.begin(1, 300, 150);
          gesture.update(1, 400, 150);
          require(gesture.finish() == TouchAction::PREVIOUS, "100 pixel right swipe");
          gesture.begin(1, 300, 150);
          gesture.update(1, 450, 350);
          require(gesture.finish() == TouchAction::NONE, "vertical drag cannot activate button or swipe");
          gesture.begin(1, 300, 150);
          gesture.update(2, 450, 150);
          require(gesture.finish() == TouchAction::NONE, "multi-touch cannot activate controls");
          require(!hidden(id(dashboard_waiting)), "waiting on reboot");
          auto sample_pixel = [&](int x, int y) {
            id(test_lcd).sample_x = x;
            id(test_lcd).sample_y = y;
            id(test_lcd).sample_pixel = esphome::Color(255, 0, 0);
            lv_obj_invalidate(lv_screen_active());
            lv_refr_now(nullptr);
            return id(test_lcd).sample_pixel;
          };
          auto check_background = [&]() {
            auto actual = sample_pixel(5, 400);
            auto expected = id(dashboard_background)->get_pixel(5, 400);
            require(actual.r == expected.r && actual.g == expected.g && actual.b == expected.b,
                    "background image rendered at expected position");
          };
          auto check_chrome = [&]() {
            auto header = sample_pixel(5, 5);
            auto footer = sample_pixel(5, 460);
            require(header.r == 0 && header.g == 0 && header.b == 0, "black header rendered");
            require((footer.r >> 3) == (153 >> 3) && (footer.g >> 2) == (153 >> 2) &&
                    (footer.b >> 3) == (153 >> 3), "grey footer rendered in RGB565");
            check_background();
          };
          auto within = [&](lv_obj_t *widget, int left, int top, int right, int bottom) {
            lv_obj_update_layout(lv_screen_active());
            lv_obj_update_layout(lv_layer_top());
            lv_area_t area;
            lv_obj_get_coords(widget, &area);
            const bool fits = area.x1 >= left && area.y1 >= top && area.x2 <= right && area.y2 <= bottom;
            if (!fits)
              ESP_LOGE("runtime_test", "Bounds (%d,%d)-(%d,%d) exceed (%d,%d)-(%d,%d)",
                       area.x1, area.y1, area.x2, area.y2, left, top, right, bottom);
            return fits;
          };
          auto tap = [&](lv_obj_t *widget) {
            lv_obj_update_layout(lv_screen_active());
            lv_obj_update_layout(lv_layer_top());
            lv_area_t area;
            lv_obj_get_coords(widget, &area);
            id(dashboard).begin_touch(1, (area.x1 + area.x2) / 2, (area.y1 + area.y2) / 2);
            return id(dashboard).end_touch();
          };
          check_chrome();
          require(lv_obj_has_state(id(dashboard_menu), LV_STATE_DISABLED), "waiting menu disabled");
          tap(id(dashboard_menu));
          require(hidden(id(navigation)), "waiting menu cannot open");
          check_background();
          for (auto *page : {id(page_0), id(page_1), id(page_2), id(page_3)}) {
            lv_obj_remove_flag(page, LV_OBJ_FLAG_HIDDEN);
            check_background();
            lv_obj_add_flag(page, LV_OBJ_FLAG_HIDDEN);
          }
          auto snapshot = [](int mode) {
            return esphome::json::build_json([mode](JsonObject root) {
              root["version"] = 1;
              JsonArray pages = root["pages"].to<JsonArray>();
              for (int p = 0; p < (mode == 4 ? 5 : 4); p++) {
                JsonObject page = pages.add<JsonObject>();
                page["title"] = p == 0 ? "Office" : "Landing";
                page["temperature"] = p == 2 ? "Temperature: 21.5 C" : "";
                JsonArray buttons = page["buttons"].to<JsonArray>();
                for (int b = 0; b < (mode == 10 ? 5 : 4); b++) {
                  JsonObject button = buttons.add<JsonObject>();
                  bool populated = mode != 3 && ((p == 0 && b == 0 && mode != 2) || (p == 2 && b == 3));
                  button["entity"] = populated ? (mode == 5 ? "cover.invalid" : mode == 6 ? "automation.test"
                    : mode == 7 || mode == 9 ? "lock.test" : mode == 8 ? "switch.test" : "light.test") : "";
                  button["name"] = populated ? "Test Light" : "";
                  button["state"] = populated ? (mode == 1 ? "unavailable" : mode == 7 ? "locked"
                    : mode == 9 ? "unlocked" : mode == 8 ? "off" : "on") : "";
                  if (mode >= 11 && populated)
                    button["icon"] = mode == 11 ? "mdi:lightbulb-auto" : mode == 12 ? "mdi:door-open"
                      : mode == 13 ? "mdi:does-not-exist" : mode == 14 ? "custom:icon" : "";
                  if (mode == 15 && populated)
                    button["icon"] = 123;
                }
              }
            });
          };
          auto choose_wake_page = [](const char *option) {
            auto call = id(wake_up_page).make_call();
            call.set_option(option);
            call.perform();
          };
          choose_wake_page("Page 3");
          id(dashboard).wake();
          require(!hidden(id(dashboard_waiting)), "waking before HA configuration retains waiting screen");
          id(dashboard).receive(snapshot(0));
          require(!hidden(id(page_2)), "pending wake selects preferred page when HA configuration arrives");
          choose_wake_page("Last used page");
          id(dashboard).wake();
          require(!hidden(id(page_2)), "last used wake-up page retains current page");
          choose_wake_page("Page 1");
          require(!hidden(id(page_2)), "changing preference does not navigate while awake");
          id(dashboard).wake();
          require(!hidden(id(page_0)), "wake selects first page");
          choose_wake_page("Page 3");
          id(dashboard).receive(snapshot(0));
          require(!hidden(id(page_0)), "HA updates do not reapply wake-up preference while awake");
          id(dashboard).wake();
          require(!hidden(id(page_2)), "wake selects third page");
          choose_wake_page("Page 4");
          id(dashboard).wake();
          require(!hidden(id(page_0)), "empty wake-up page falls back to first populated page");
          choose_wake_page("Last used page");
          require(!hidden(id(page_0)) && hidden(id(page_2)), "first nonempty page shown");
          require(hidden(id(page_1)) && hidden(id(page_3)), "empty pages hidden");
          require(!hidden(id(dot_0_0)) && !hidden(id(dot_0_1)) && hidden(id(dot_0_2)), "two visible page dots");
          require(std::string(lv_label_get_text(id(button_0_0_state))) == "ON", "light state");
          auto icon_is = [](lv_obj_t *widget, const char *name) {
            const auto glyph = wallpanel::mdi_glyph(name);
            return glyph != nullptr && std::string(lv_label_get_text(widget)) == glyph;
          };
          require(icon_is(id(button_0_0_icon), "mdi:lightbulb"), "legacy snapshot uses HA light default");
          for (const auto &icon : wallpanel::MDI_ICONS) {
            require(wallpanel::mdi_glyph(std::string("mdi:") + icon.name) == icon.glyph,
                    "every MDI name is resolvable");
          }
          require(id(font_icons)->get_glyphs().size() == std::size(wallpanel::MDI_ICONS),
                  "full MDI catalogue included in font");
          for (auto *font : {id(font_icons), id(font_dense_icons)}) {
            for (const auto &glyph : font->get_glyphs()) {
              lv_font_glyph_dsc_t descriptor{};
              require(lv_font_get_glyph_dsc(font->get_lv_font(), &descriptor, glyph.code_point, 0),
                      "every MDI glyph exists at both compiled sizes");
            }
          }
          require(!lv_obj_has_state(id(button_0_0), LV_STATE_DISABLED), "available control enabled");
          check_chrome();
          require(within(id(title_0), 0, 0, 599, 55) && within(id(lbl_time), 600, 0, 799, 55),
                  "page title and clock fit within separate header regions");
          require(within(id(dashboard_menu), 0, 432, 799, 479) &&
                  lv_obj_get_width(id(dashboard_menu)) >= 44 && lv_obj_get_height(id(dashboard_menu)) >= 44,
                  "menu has a footer-contained accessible touch target");
          require(within(id(button_0_0), 0, 56, 799, 431), "entity tile fits between bars");
          require(tap(id(dashboard_menu)) == TouchAction::TAP &&
                  !hidden(id(navigation)) && hidden(id(page_0)), "menu opens on release");
          require(hidden(id(dashboard_connection)), "menu tap does not invoke an HA entity action");
          require(!hidden(id(navigation_0)) && hidden(id(navigation_1)) &&
                  !hidden(id(navigation_2)) && hidden(id(navigation_3)), "menu omits empty slots");
          require(std::string(lv_label_get_text(id(navigation_0_title))) == "Office" &&
                  std::string(lv_label_get_text(id(navigation_2_title))) == "Landing", "menu uses page titles");
          require(lv_obj_get_x(id(navigation_0)) == 20 && lv_obj_get_y(id(navigation_0)) == 65 &&
                  lv_obj_get_x(id(navigation_2)) == 420 && lv_obj_get_y(id(navigation_2)) == 65,
                  "nonadjacent page slots compact into first row");
          require(!lv_obj_is_visible(id(temperature_2)) && !lv_obj_is_visible(id(dot_0_0)),
                  "navigation hides page-specific footer data");
          require(within(id(navigation_title), 0, 0, 599, 55) &&
                  within(id(navigation_2), 0, 56, 799, 431), "navigation fits header and content bounds");
          check_chrome();
          id(dashboard).begin_touch(1, 300, 150);
          id(dashboard).update_touch(1, 180, 150);
          require(id(dashboard).end_touch() == TouchAction::NONE && !hidden(id(navigation)),
                  "navigation swipes do not select a page");
          id(dashboard).begin_touch(1, 768, 456);
          id(dashboard).update_touch(1, 790, 456);
          id(dashboard).update_touch(1, 768, 456);
          require(id(dashboard).end_touch() == TouchAction::NONE && !hidden(id(navigation)),
                  "menu drag returning to origin does not close navigation");
          id(dashboard).begin_touch(1, 768, 456);
          id(dashboard).update_touch(2, 768, 456);
          require(id(dashboard).end_touch() == TouchAction::NONE && !hidden(id(navigation)),
                  "multitouch cannot operate the menu");
          id(dashboard).begin_touch(1, 200, 150);
          id(dashboard).update_touch(2, 200, 150);
          require(id(dashboard).end_touch() == TouchAction::NONE && !hidden(id(navigation)),
                  "multitouch cannot select a page");
          id(dashboard).begin_touch(1, 200, 150);
          id(dashboard).update_touch(1, 200, 172);
          id(dashboard).update_touch(1, 200, 150);
          require(id(dashboard).end_touch() == TouchAction::NONE && !hidden(id(navigation)),
                  "page-button drag cannot become a tap");
          id(dashboard).begin_touch(1, 743, 456);
          id(dashboard).update_touch(1, 750, 456);
          id(dashboard).end_touch();
          require(!hidden(id(navigation)), "tap must start and finish on the same menu target");
          tap(id(navigation_2));
          require(hidden(id(navigation)) && !hidden(id(page_2)), "menu selects original third slot");
          require(within(id(temperature_2), 0, 432, 323, 479) &&
                  within(id(dot_2_1), 324, 432, 743, 479), "temperature and dots fit footer regions");
          tap(id(dashboard_menu));
          tap(id(dashboard_menu));
          require(hidden(id(navigation)) && !hidden(id(page_2)), "menu toggle preserves current page");
          tap(id(dashboard_menu));
          id(dashboard).wake();
          require(hidden(id(navigation)) && !hidden(id(page_2)), "last-used wake closes navigation");
          tap(id(dashboard_menu));
          choose_wake_page("Page 1");
          id(dashboard).wake();
          require(hidden(id(navigation)) && !hidden(id(page_0)), "explicit wake closes navigation and selects page");
          choose_wake_page("Last used page");
          for (bool menu_open : {false, true}) {
            if (menu_open)
              tap(id(dashboard_menu));
            const int x = menu_open ? 600 : 768;
            const int y = menu_open ? 150 : 456;
            if (idle.begin_touch(false, 22000))
              id(dashboard).begin_touch(1, x, y);
            id(dashboard).wake();
            if (idle.accepts_touch())
              id(dashboard).update_touch(1, x, y);
            if (idle.end_touch(22001))
              id(dashboard).end_touch();
            require(hidden(id(navigation)) && !hidden(id(page_0)),
                    "waking touch cannot open menu or select a navigation page");
          }
          auto edit_snapshot = [&](auto edit) {
            return esphome::json::build_json([&](JsonObject root) {
              esphome::json::parse_json(snapshot(0), [&](JsonObject source) {
                root.set(source);
                edit(root);
                return true;
              });
            });
          };
          tap(id(dashboard_menu));
          id(dashboard).begin_touch(1, 600, 150);
          id(dashboard).receive(edit_snapshot([](JsonObject root) {
            root["pages"][0]["title"] = " \t\r\n";
            root["pages"][2]["title"] = "Upstairs";
          }));
          require(id(dashboard).end_touch() == TouchAction::NONE && !hidden(id(navigation)),
                  "live title changes cancel stale navigation gestures");
          require(std::string(lv_label_get_text(id(navigation_0_title))) == "Page 1" &&
                  std::string(lv_label_get_text(id(navigation_2_title))) == "Upstairs",
                  "menu updates renamed pages and whitespace fallback titles");
          tap(id(navigation_0));
          require(std::string(lv_label_get_text(id(title_0))) == "Page 1", "header shares fallback page title");
          tap(id(dashboard_menu));
          id(dashboard).receive(edit_snapshot([](JsonObject root) {
            root["pages"][1]["buttons"].set(root["pages"][0]["buttons"]);
            root["pages"][1]["title"] = "Office";
            root["pages"][3]["buttons"].set(root["pages"][0]["buttons"]);
            root["pages"][3]["title"] = "A very long page title that must not overlap any adjacent controls";
            root["pages"][3]["temperature"] = "A long temperature value that must not overlap dots or tiles";
          }));
          require(!hidden(id(navigation_1)) && !hidden(id(navigation_3)) &&
                  lv_obj_get_y(id(navigation_3)) == 230, "new page slots appear in second menu row");
          require(within(id(navigation_3_title), 440, 230, 759, 384) &&
                  lv_obj_get_height(id(navigation_3_title)) <= 32, "long menu title remains a single clipped line");
          tap(id(navigation_1));
          require(!hidden(id(page_1)), "duplicate title still selects its own fixed slot");
          tap(id(dashboard_menu));
          tap(id(navigation_3));
          require(!hidden(id(page_3)), "menu selects fourth page");
          require(within(id(title_3), 0, 0, 599, 55), "long page title stays out of clock region");
          require(within(id(temperature_3), 0, 432, 323, 479), "long temperature stays within footer region");
          tap(id(dashboard_menu));
          id(dashboard).begin_touch(1, 600, 300);
          id(dashboard).receive(snapshot(0));
          require(id(dashboard).end_touch() == TouchAction::NONE && !hidden(id(navigation)) &&
                  hidden(id(navigation_3)), "removing current and touched page cancels selection");
          tap(id(dashboard_menu));
          require(!hidden(id(page_0)), "removed current page falls back after closing menu");
          tap(id(dashboard_menu));
          id(dashboard).begin_touch(1, 600, 150);
          id(dashboard).receive(snapshot(0));
          require(id(dashboard).end_touch() == TouchAction::TAP && !hidden(id(page_2)),
                  "unchanged periodic snapshots do not cancel navigation taps");
          tap(id(dashboard_menu));
          id(dashboard).begin_touch(1, 200, 150);
          id(dashboard).receive(edit_snapshot([](JsonObject root) {
            root["pages"][0]["buttons"][0]["state"] = "off";
          }));
          require(id(dashboard).end_touch() == TouchAction::TAP && !hidden(id(page_0)),
                  "entity state-only updates do not cancel local page selection");
          id(dashboard).receive(snapshot(0));
          id(dashboard).navigate(1);
          require(hidden(id(page_0)) && !hidden(id(page_2)), "swipe skips empty page");
          require(lv_obj_get_style_bg_opa(id(dot_2_1), LV_PART_MAIN) == LV_OPA_COVER &&
                  lv_obj_get_style_bg_opa(id(dot_2_0), LV_PART_MAIN) == LV_OPA_TRANSP, "current page dot highlighted");
          require(std::string(lv_label_get_text(id(temperature_2))) == "Temperature: 21.5 C", "dynamic temperature");
          id(dashboard).navigate(1);
          require(!hidden(id(page_0)), "next wraps from last page to first");
          id(dashboard).navigate(-1);
          require(!hidden(id(page_2)), "previous wraps from first page to last");
          id(dashboard).navigate(-1);
          require(!hidden(id(page_0)), "previous page skips empty slots");
          id(dashboard).begin_touch(1, 300, 150);
          id(dashboard).update_touch(1, 180, 150);
          require(!hidden(id(page_0)), "swipe over button waits for release");
          require(id(dashboard).end_touch() == TouchAction::NEXT && !hidden(id(page_2)),
                  "swipe over button changes page, not a tap");
          require(id(dashboard).end_touch() == TouchAction::NONE && !hidden(id(page_2)),
                  "swipe only changes page once");
          id(dashboard).navigate(-1);
          id(dashboard).receive(snapshot(1));
          require(std::string(lv_label_get_text(id(button_0_0_state))) == "ON", "last known appearance retained");
          require(icon_is(id(button_0_0_icon), "mdi:lightbulb"), "unavailable light retains its icon");
          require(lv_obj_has_state(id(button_0_0), LV_STATE_DISABLED), "unavailable entity disabled");
          id(dashboard).receive(snapshot(0));
          id(dashboard).check_connection();
          require(lv_obj_has_state(id(button_0_0), LV_STATE_DISABLED), "disconnection disables controls");
          require(!hidden(id(dashboard_connection)), "offline indicator");
          require(within(id(dashboard_connection), 0, 56, 799, 431), "offline indicator stays above footer");
          tap(id(dashboard_menu));
          require(!hidden(id(navigation)) && !lv_obj_has_state(id(navigation_2), LV_STATE_DISABLED),
                  "offline navigation remains available");
          tap(id(navigation_2));
          require(!hidden(id(page_2)) && lv_obj_has_state(id(button_0_3), LV_STATE_DISABLED),
                  "offline page selection preserves disabled entity controls");
          tap(id(dashboard_menu));
          id(dashboard).begin_touch(1, 200, 150);
          id(dashboard).receive(snapshot(2));
          require(id(dashboard).end_touch() == TouchAction::NONE && !hidden(id(navigation)) &&
                  hidden(id(navigation_0)), "removed navigation target cannot be selected");
          lv_obj_update_layout(id(navigation));
          require(lv_obj_get_x(id(navigation_2)) == 220 && lv_obj_get_y(id(navigation_2)) == 65,
                  "single navigation page is centred");
          tap(id(navigation_2));
          require(hidden(id(page_0)) && !hidden(id(page_2)), "single page menu selects remaining slot");
          require(hidden(id(dot_2_0)) && hidden(id(dot_2_1)), "single page has no dots");
          id(dashboard).navigate(1);
          id(dashboard).navigate(-1);
          require(!hidden(id(page_2)), "single-page wrapping stays on its page");
          id(dashboard).receive(snapshot(4));
          require(hidden(id(page_0)) && !hidden(id(page_2)), "reject fifth page atomically");
          id(dashboard).receive(snapshot(5));
          require(hidden(id(page_0)) && !hidden(id(page_2)), "reject unsupported domain atomically");
          id(dashboard).receive(snapshot(10));
          require(hidden(id(page_0)) && !hidden(id(page_2)), "reject fifth button atomically");
          id(dashboard).receive("{bad json");
          require(!hidden(id(page_2)), "reject invalid JSON without replacing layout");
          for (auto entry : {std::pair<int, const char *>{6, "ENABLED"}, {7, "LOCKED"}, {8, "OFF"}, {9, "UNLOCKED"}}) {
            id(dashboard).receive(snapshot(entry.first));
            require(std::string(lv_label_get_text(id(button_0_3_state))) == entry.second, "domain-specific state");
          }
          require(icon_is(id(button_0_3_icon), "mdi:lock-open-variant"), "unlocked HA default");
          id(dashboard).receive(snapshot(7));
          require(icon_is(id(button_0_3_icon), "mdi:lock"), "locked HA default");
          id(dashboard).receive(snapshot(8));
          require(icon_is(id(button_0_3_icon), "mdi:toggle-switch-variant-off"), "switch off default");
          id(dashboard).receive(snapshot(11));
          require(icon_is(id(button_0_3_icon), "mdi:lightbulb-auto"), "HA custom automation icon");
          id(dashboard).receive(snapshot(12));
          require(icon_is(id(button_0_3_icon), "mdi:door-open"), "HA custom door icon");
          id(dashboard).receive(snapshot(15));
          require(icon_is(id(button_0_3_icon), "mdi:door-open"), "invalid icon type rejects snapshot atomically");
          for (int mode : {13, 14, 16}) {
            id(dashboard).receive(snapshot(mode));
            require(icon_is(id(button_0_3_icon), "mdi:lightbulb"), "unsupported or cleared icon uses default");
          }
          auto state_snapshot = [&](const char *entity, const char *state) {
            return esphome::json::build_json([&](JsonObject root) {
              esphome::json::parse_json(snapshot(0), [&](JsonObject source) {
                root.set(source);
                root["pages"][2]["buttons"][3]["entity"] = entity;
                root["pages"][2]["buttons"][3]["state"] = state;
                return true;
              });
            });
          };
          for (auto entry : {std::pair<const char *, const char *>{"off", "mdi:lightbulb-off"},
                              {"on", "mdi:lightbulb"}}) {
            id(dashboard).receive(state_snapshot("light.test", entry.first));
            require(icon_is(id(button_0_3_icon), entry.second), "light icon follows on/off state");
          }
          id(dashboard).receive(state_snapshot("automation.test", "off"));
          require(icon_is(id(button_0_3_icon), "mdi:robot-off"), "automation off default");
          id(dashboard).receive(state_snapshot("automation.test", "unavailable"));
          require(icon_is(id(button_0_3_icon), "mdi:robot-off"), "unavailable automation retains its icon");
          id(dashboard).receive(state_snapshot("lock.test", "unavailable"));
          require(icon_is(id(button_0_3_icon), "mdi:lock"), "changed unavailable entity resets prior icon");
          for (auto entry : {std::pair<const char *, const char *>{"locking", "mdi:lock-clock"},
                              {"jammed", "mdi:lock-alert"}, {"open", "mdi:lock-open-variant"}}) {
            id(dashboard).receive(state_snapshot("lock.test", entry.first));
            require(icon_is(id(button_0_3_icon), entry.second), "lock transition icon");
            require(lv_obj_has_state(id(button_0_3), LV_STATE_DISABLED), "lock transition stays non-actionable");
          }
          tap(id(dashboard_menu));
          id(dashboard).receive(snapshot(3));
          id(dashboard).navigate(1);
          id(dashboard).navigate(-1);
          require(!hidden(id(dashboard_waiting)) && hidden(id(page_2)), "all pages cleared");
          require(hidden(id(navigation)) && lv_obj_has_state(id(dashboard_menu), LV_STATE_DISABLED),
                  "clearing all pages closes navigation and disables menu");
          check_chrome();
          choose_wake_page("Page 3");
          id(dashboard).wake();
          require(!hidden(id(dashboard_waiting)), "wake with no pages retains waiting screen");
          id(dashboard).receive(snapshot(0));
          require(!hidden(id(page_2)), "wake with no pages waits for populated configuration");
          auto build_snapshot = [&](const esphome::json::json_build_t &build) {
            JsonDocument document(esphome::json::heap_json_allocator());
            build(document.to<JsonObject>());
            require(!document.overflowed(), "test snapshot allocation");
            std::string result;
            serializeJson(document, result);
            return result;
          };
          auto modern = [&](const char *layout, size_t populated = 18) {
            return build_snapshot([&](JsonObject root) {
              root["version"] = 2;
              root["navigation_layout"] = "4x2";
              auto pages = root["pages"].to<JsonArray>();
              const size_t capacity = std::string(layout) == "2x2" ? 4 : std::string(layout) == "4x2" ? 8 : 18;
              for (size_t p = 0; p < wallpanel::MAX_PAGES; p++) {
                auto page = pages.add<JsonObject>();
                page["title"] = "Modern page " + std::to_string(p + 1);
                page["temperature"] = "Temperature: 21.5 C";
                page["layout"] = layout;
                page["icon"] = p == 7 ? "mdi:door-open" : "";
                auto buttons = page["buttons"].to<JsonArray>();
                for (size_t b = 0; b < capacity; b++) {
                  auto button = buttons.add<JsonObject>();
                  button["entity"] = b < populated ? "light.p" + std::to_string(p) + "_b" + std::to_string(b) : "";
                  button["name"] = "Control " + std::to_string(b + 1);
                  button["state"] = "on";
                  button["icon"] = "mdi:ceiling-light";
                }
              }
            });
          };
          auto transform = [&](const std::string &body, auto edit) {
            return build_snapshot([&](JsonObject root) {
              esphome::json::parse_json(body, [&](JsonObject source) {
                root.set(source);
                edit(root);
                return true;
              });
            });
          };
          const std::array<lv_obj_t *, 18> tiles = {
            id(button_0_0), id(button_0_1), id(button_0_2), id(button_0_3),
            id(button_0_4), id(button_0_5), id(button_0_6), id(button_0_7),
            id(button_0_8), id(button_0_9), id(button_0_10), id(button_0_11),
            id(button_0_12), id(button_0_13), id(button_0_14), id(button_0_15),
            id(button_0_16), id(button_0_17)
          };
          choose_wake_page("Page 1");
          for (const char *layout : {"2x2", "4x2", "6x3"}) {
            id(dashboard).receive(modern(layout));
            id(dashboard).wake();
            const size_t capacity = std::string(layout) == "2x2" ? 4 : std::string(layout) == "4x2" ? 8 : 18;
            for (size_t b = 0; b < tiles.size(); b++) {
              require(hidden(tiles[b]) == (b >= capacity), "grid capacity controls tile visibility");
              if (b >= capacity)
                continue;
              require(within(tiles[b], 0, 56, 799, 431), "grid tile remains within content");
              lv_area_t area;
              lv_obj_get_coords(tiles[b], &area);
              for (int child : {0, 1, 2}) {
                auto *label = lv_obj_get_child(tiles[b], child);
                if (lv_obj_is_visible(label))
                  require(within(label, area.x1, area.y1, area.x2, area.y2), "grid child remains inside tile");
              }
              for (size_t previous = 0; previous < b; previous++) {
                lv_area_t other;
                lv_obj_get_coords(tiles[previous], &other);
                require(area.x1 > other.x2 || other.x1 > area.x2 || area.y1 > other.y2 || other.y1 > area.y2,
                        "populated grid tiles never overlap");
              }
            }
            require(hidden(id(button_0_0_state)) == (capacity == 18), "only 6x3 hides state text");
            require(lv_color_eq(lv_obj_get_style_text_color(id(button_0_0_icon), LV_PART_MAIN), lv_color_hex(0xFFD166)),
                    "active entity icon is amber in every layout");
            require(within(id(dot_0_7), 324, 432, 743, 479), "eight dots fit reserved footer region");
          }
          id(dashboard).receive(modern("6x3", 8));
          lv_obj_update_layout(id(page_0));
          require(lv_obj_get_x(id(button_0_6)) == 277 && lv_obj_get_x(id(button_0_7)) == 405,
                  "6x3 centres an incomplete second row");
          id(dashboard).receive(transform(modern("4x2", 3), [](JsonObject root) {
            auto buttons = root["pages"][0]["buttons"];
            buttons[7].set(buttons[2]);
            buttons[2]["entity"] = "";
          }));
          lv_obj_update_layout(id(page_0));
          require(!hidden(id(button_0_7)) && hidden(id(button_0_2)) &&
                  lv_obj_get_x(id(button_0_7)) == 507, "sparse high slots compact without changing identity");
          id(dashboard).receive(modern("6x3"));
          tap(id(dashboard_menu));
          require(!hidden(id(navigation_7)) && icon_is(id(navigation_7_icon), "mdi:door-open") &&
                  icon_is(id(navigation_0_icon), "mdi:view-dashboard"), "eight-page menu includes custom and fallback icons");
          require(within(id(navigation_7_icon), 605, 230, 779, 384) &&
                  within(id(navigation_7_title), 655, 230, 779, 384), "menu icon and title fit side by side");
          tap(id(navigation_7));
          require(!hidden(id(page_7)) && std::string(lv_label_get_text(id(button_0_17_name))) == "Control 18",
                  "menu reaches page eight and its eighteenth control");
          choose_wake_page("Last used page");
          tap(id(dashboard_menu));
          id(dashboard).wake();
          require(!hidden(id(page_7)) && hidden(id(navigation)), "last-used wake supports page eight");
          choose_wake_page("Page 8");
          id(dashboard).receive(modern("2x2"));
          id(dashboard).wake();
          require(!hidden(id(page_7)), "explicit wake supports page eight");
          id(dashboard).receive(transform(modern("6x3"), [](JsonObject root) {
            root["navigation_layout"] = "6x3";
          }));
          tap(id(dashboard_menu));
          lv_obj_update_layout(id(navigation));
          require(lv_obj_get_x(id(navigation_6)) == 277 && lv_obj_get_y(id(navigation_7)) == 175,
                  "independent dense menu centres its incomplete row");
          id(dashboard).begin_touch(1, 464, 225);
          id(dashboard).receive(modern("6x3"));
          require(id(dashboard).end_touch() == TouchAction::NONE && !hidden(id(navigation)),
                  "menu layout changes invalidate stale targets");
          tap(id(navigation_0));
          id(dashboard).begin_touch(1, 80, 110);
          id(dashboard).receive(modern("4x2"));
          require(id(dashboard).end_touch() == TouchAction::NONE, "entity layout changes cancel pending presses");
          for (const char *layout : {"2x2", "4x2", "6x3"}) {
            for (auto entry : {std::pair<const char *, uint32_t>{"on", 0xFFD166}, {"off", 0xAAB4C5},
                               {"unavailable", 0xAAB4C5}, {"unknown", 0xAAB4C5}}) {
              id(dashboard).receive(transform(modern(layout), [&](JsonObject root) {
                root["pages"][0]["buttons"][0]["state"] = entry.first;
              }));
              require(icon_is(id(button_0_0_icon), "mdi:ceiling-light") &&
                      lv_color_eq(lv_obj_get_style_text_color(id(button_0_0_icon), LV_PART_MAIN), lv_color_hex(entry.second)),
                      "custom icon retains glyph and follows state colour");
              const bool unavailable = std::string(entry.first) == "unavailable" || std::string(entry.first) == "unknown";
              require(lv_obj_has_state(id(button_0_0), LV_STATE_DISABLED) == unavailable,
                      "unavailable controls remain disabled");
            }
          }
          for (auto entry : {std::pair<const char *, uint32_t>{"locked", 0x68D391}, {"unlocked", 0xF87171},
                             {"jammed", 0xF87171}, {"locking", 0xFFD166}, {"open", 0xF87171}}) {
            id(dashboard).receive(transform(modern("6x3"), [&](JsonObject root) {
              root["pages"][0]["buttons"][0]["entity"] = "lock.test";
              root["pages"][0]["buttons"][0]["state"] = entry.first;
            }));
            require(lv_color_eq(lv_obj_get_style_text_color(id(button_0_0_icon), LV_PART_MAIN), lv_color_hex(entry.second)),
                    "lock icon reflects locked, unlocked, jammed and transition states");
          }
          id(dashboard).check_connection();
          require(lv_color_eq(lv_obj_get_style_text_color(id(button_0_0_icon), LV_PART_MAIN), lv_color_hex(0xAAB4C5)) &&
                  lv_obj_has_state(id(button_0_0), LV_STATE_DISABLED), "offline icon is grey and disabled");
          id(dashboard).receive(modern("6x3"));
          require(!lv_obj_has_state(id(button_0_0), LV_STATE_DISABLED), "reconnection restores controls");
          id(dashboard).begin_touch(1, 80, 110);
          id(dashboard).navigate(1);
          require(id(dashboard).end_touch() == TouchAction::NONE && !hidden(id(page_1)),
                  "reusing a tile for another page cannot activate the previous touch target");
          id(dashboard).navigate(-1);
          id(dashboard).receive(transform(modern("6x3"), [](JsonObject root) {
            root["pages"][0]["buttons"][0]["icon"] = "";
            root["pages"][0]["buttons"][0]["state"] = "off";
            root["pages"][2]["buttons"][0]["entity"] = "automation.other_page";
            root["pages"][2]["buttons"][0]["icon"] = "";
            root["pages"][2]["buttons"][0]["state"] = "off";
          }));
          require(icon_is(id(button_0_0_icon), "mdi:lightbulb-off"),
                  "active page appearance does not inherit hidden-page entities");
          id(dashboard).receive(transform(modern("6x3"), [](JsonObject root) {
            root["pages"][0]["buttons"][0]["icon"] = "";
            root["pages"][0]["buttons"][0]["state"] = "unavailable";
            root["pages"][2]["buttons"][0]["entity"] = "automation.other_page";
            root["pages"][2]["buttons"][0]["icon"] = "";
            root["pages"][2]["buttons"][0]["state"] = "unavailable";
          }));
          choose_wake_page("Page 3");
          id(dashboard).wake();
          require(icon_is(id(button_0_0_icon), "mdi:robot-off") &&
                  std::string(lv_label_get_text(id(button_0_0_state))) == "DISABLED" &&
                  lv_obj_has_state(id(button_0_0), LV_STATE_DISABLED),
                  "hidden-page state changes retain that entity's own last-known appearance");
          choose_wake_page("Page 1");
          id(dashboard).wake();
          require(icon_is(id(button_0_0_icon), "mdi:lightbulb-off") &&
                  std::string(lv_label_get_text(id(button_0_0_state))) == "OFF",
                  "page switches restore independent cached appearances into shared tiles");
          id(dashboard).receive(transform(modern("6x3"), [](JsonObject root) {
            root["pages"][0]["buttons"][0]["entity"] = "lock.replacement";
            root["pages"][0]["buttons"][0]["icon"] = "";
            root["pages"][0]["buttons"][0]["state"] = "unavailable";
          }));
          require(icon_is(id(button_0_0_icon), "mdi:lock") &&
                  std::string(lv_label_get_text(id(button_0_0_state))) == "UNKNOWN",
                  "replacing an unavailable entity cannot inherit the prior entity's appearance");
          id(dashboard).receive(modern("6x3"));
          for (int invalid = 0; invalid < 7; invalid++) {
            id(dashboard).receive(transform(modern("6x3"), [&](JsonObject root) {
              if (invalid == 0) root["navigation_layout"] = "2x2";
              if (invalid == 1) root["pages"][0]["layout"] = "3x3";
              if (invalid == 2) root["pages"][0]["buttons"].as<JsonArray>().remove(17);
              if (invalid == 3 || invalid == 5) root["pages"].as<JsonArray>().remove(7);
              if (invalid == 4) root["pages"][0]["icon"] = 123;
              if (invalid == 5) root["pages"].as<JsonArray>().remove(6);
              if (invalid == 6) root["pages"].as<JsonArray>().add(root["pages"][0]);
              root["pages"][0]["title"] = "Invalid update";
            }));
            require(std::string(lv_label_get_text(id(title_0))) == "Modern page 1",
                    "invalid version-2 snapshots are rejected atomically");
          }
          id(dashboard).receive(std::string(wallpanel::MAX_PAYLOAD_BYTES + 1, 'x'));
          require(std::string(lv_label_get_text(id(title_0))) == "Modern page 1", "oversized snapshot preserves UI");
          id(dashboard).receive(transform(modern("6x3"), [](JsonObject root) {
            root["pages"][7]["icon"] = "mdi:does-not-exist";
          }));
          require(icon_is(id(navigation_7_icon), "mdi:view-dashboard"), "unsupported page icon uses fallback");
          id(dashboard).receive(snapshot(0));
          require(hidden(id(page_7)) && hidden(id(navigation_7)), "legacy snapshots clear additional page slots");
          const std::string body = modern("6x3");
          const int total = (body.size() + wallpanel::CHUNK_BYTES - 1) / wallpanel::CHUNK_BYTES;
          id(dashboard).receive_chunk("bad", 0, total, "~" + body.substr(0, wallpanel::CHUNK_BYTES));
          require(std::string(lv_label_get_text(id(title_0))) == "Office", "partial transfer cannot replace current UI");
          id(dashboard).receive_chunk("bad", 2, total, "~x");
          id(dashboard).receive_chunk("wrong", 1, total, "~x");
          id(dashboard).receive_chunk("bad", 0, 1, body);
          id(dashboard).receive_chunk("bad", 0, 65, "~x");
          id(dashboard).receive_chunk("bad", 0, 1, "~" + std::string(wallpanel::CHUNK_BYTES + 1, 'x'));
          require(std::string(lv_label_get_text(id(title_0))) == "Office", "malformed chunks preserve current UI");
          for (int index = 0; index < total; index++)
            id(dashboard).receive_chunk("complete", index, total,
                "~" + body.substr(index * wallpanel::CHUNK_BYTES, wallpanel::CHUNK_BYTES));
          require(std::string(lv_label_get_text(id(title_0))) == "Modern page 1" &&
                  std::string(lv_label_get_text(id(button_0_17_name))) == "Control 18",
                  "complete ordered chunks apply all 144 controls together");
          id(dashboard).receive(snapshot(0));
          ESP_LOGI("runtime_test", "All runtime dashboard assertions passed");
          if (std::getenv("WALLPANEL_API_TEST") == nullptr)
            std::exit(0);

host:
logger:
api:
  port: 16053
  actions:
    - action: test_tap
      variables:
        x: int
        y: int
      then:
        - lambda: |-
            id(dashboard).begin_touch(1, x, y);
            id(dashboard).end_touch();
    - action: test_wake
      then:
        - lambda: id(dashboard).wake();
text_sensor:
  - platform: template
    name: Transport probe
    id: transport_probe
    update_interval: 100ms
    lambda: |-
      return esphome::json::build_json([&](JsonObject root) {
        auto *label = id(button_0_17_name);
        const auto mode = lv_label_get_long_mode(label);
        // DOT mode edits the visible text buffer; restore it to inspect the full received label.
        lv_label_set_long_mode(label, LV_LABEL_LONG_CLIP);
        lv_obj_update_layout(label);
        root["last_name"] = std::string(lv_label_get_text(label));
        lv_label_set_long_mode(label, mode);
        lv_obj_update_layout(label);
        root["page8_visible"] = lv_obj_is_visible(id(page_7));
        root["menu_visible"] = lv_obj_is_visible(id(navigation));
        root["heap_bytes"] = id(test_lcd).allocated_bytes();
        root["tick"] = esphome::millis();
      });
packages:
  dashboard: !include ../../esphome/dashboard.yaml
  dynamic: !include ../../esphome/dynamic.yaml
external_components:
  - source:
      type: local
      path: test_components
    components: [test_display]
test_display:
  id: test_lcd
  auto_clear_enabled: false
  update_interval: never
