          require(id(dashboard).sensor_hold(), "OTA fallback blanking does not become manual Sleep");
          id(dashboard).backlight_off();
          id(dashboard).begin_update();
          id(dashboard).backlight_on();
          id(dashboard).finish_update();
          receive(ota_hold);
          require(!id(dashboard).sensor_hold(), "OTA recovery preserves a prior manual-sleep override");
          id(dashboard).touch_activity();
          receive(snapshot(3));
          require(hidden(id(light_detail)), "removing the primary entity safely closes detail view");
          choose_wake_page("Last used page");
          receive(snapshot(0));
          id(dashboard).wake();
          ESP_LOGI("runtime_test", "All runtime dashboard assertions passed");
          if (std::getenv("WALLPANEL_API_TEST") == nullptr)
            std::exit(0);

host:
globals:
  - id: test_backlight
    type: bool
    initial_value: 'true'
  - id: test_restarts
    type: int
    initial_value: '0'
  - id: test_activity
    type: int
    initial_value: '0'
  - id: test_endpoint_updates
    type: int
    initial_value: '0'
  - id: test_release_updates
    type: int
    initial_value: '0'
logger:
api:
  port: 16053
  actions:
    - action: test_tap
      variables:
        x: int
        y: int
      then:
        - lambda: |-
            id(dashboard).begin_touch(1, x, y);
            id(dashboard).end_touch();
    - action: test_wake
      then:
        - lambda: id(dashboard).wake();
    - action: test_expire
      then:
        - lambda: id(dashboard).check_connection(millis() + 65000);
    - action: test_touch
      variables:
        phase: int
        x: int
        y: int
      then:
        - lambda: |-
            if (phase == 0) id(dashboard).begin_touch(1, x, y);
            else if (phase == 1) id(dashboard).update_touch(1, x, y);
            else if (phase == 2) id(dashboard).end_touch();
            else if (phase == 3) id(dashboard).check_touch_hold(millis() + 600);
            else if (phase == 4 || phase == 5) {
              using namespace esphome::touchscreen;
              TouchPoints_t frame{
                TouchPoint{.id = 2, .x = uint16_t(x + 4), .y = uint16_t(y + 4), .state = STATE_PRESSED},
              };
              if (phase == 4)
                frame.push_back(TouchPoint{.id = 1, .x = uint16_t(x), .y = uint16_t(y), .state = STATE_UPDATED});
              id(dashboard).update_touches(frame);
            }
text_sensor:
  - id: !extend release_status_sensor
    on_value:
      then:
        - lambda: id(test_release_updates)++;
  - id: !extend dashboard_endpoint
    on_value:
      then:
        - lambda: id(test_endpoint_updates)++;
  - platform: template
    name: Transport probe
    id: transport_probe
    update_interval: 100ms
    lambda: |-
      return esphome::json::build_json([&](JsonObject root) {
        auto *label = id(button_0_17_name);
        const auto mode = lv_label_get_long_mode(label);
        // DOT mode edits the visible text buffer; restore it to inspect the full received label.
        lv_label_set_long_mode(label, LV_LABEL_LONG_CLIP);
        lv_obj_update_layout(label);
        root["last_name"] = std::string(lv_label_get_text(label));
        lv_label_set_long_mode(label, mode);
        lv_obj_update_layout(label);
        root["page8_visible"] = lv_obj_is_visible(id(page_7));
        root["menu_visible"] = lv_obj_is_visible(id(navigation));
        root["homepage_visible"] = lv_obj_is_visible(id(homepage));
        root["settings_visible"] = lv_obj_is_visible(id(settings));
        root["detail_visible"] = lv_obj_is_visible(id(light_detail));
        root["slider_visible"] = lv_obj_is_visible(id(detail_slider));
        root["wheel_visible"] = lv_obj_is_visible(id(detail_wheel));
        root["detail_value"] = std::string(lv_label_get_text(id(detail_value)));
        root["detail_status"] = std::string(lv_label_get_text(id(detail_status)));
        root["related_white"] = lv_color_eq(lv_obj_get_style_bg_color(id(button_0_5), LV_PART_MAIN),
                                            lv_color_hex(0xFFFFFF));
        root["sensor_hold"] = id(dashboard).sensor_hold();
        root["backlight"] = id(test_backlight);
        root["restarts"] = id(test_restarts);
        root["endpoint_updates"] = id(test_endpoint_updates);
        root["release_updates"] = id(test_release_updates);
        root["twelve_hour"] =
            id(dashboard).localization().twelve_hour;
        root["heap_bytes"] = id(test_lcd).allocated_bytes();
        root["tick"] = esphome::millis();
      });
packages:
  dashboard: !include ../../esphome/dashboard.yaml
  dynamic: !include ../../esphome/dynamic.yaml
  clock: !include ../../esphome/home_assistant.yaml
external_components:
  - source:
      type: local
      path: test_components
    components: [test_display, test_touchscreen]
test_touchscreen:
  id: test_touch
  update_interval: never
test_display:
  id: test_lcd
  auto_clear_enabled: false
  update_interval: never
