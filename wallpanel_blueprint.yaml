blueprint:
  name: HA ESP32-S3 Touch LCD 5 - Button pages
  description: >-
    Configure up to eight button pages without rebuilding firmware. Each page supports an icon,
    a title, an optional temperature sensor and 2x2, 4x2 or 6x3 layouts (4, 8 or 18 controls).
    Empty pages and buttons are hidden. Optional button titles override Home Assistant friendly names.
    Automation buttons enable/disable automations; they do not trigger them.
    Enable "Allow the device to perform Home Assistant actions" in the ESPHome integration.
    Create only one configuration automation per panel.
    Install version-2-capable firmware before importing this blueprint.
  domain: automation
  source_url: https://raw.githubusercontent.com/otghcloud/ha-esp32-s3-touch-lcd5/refs/heads/main/wallpanel_blueprint.yaml
  homeassistant:
    min_version: 2025.7.0
  input:
    panel_device:
      name: Panel device (required)
      description: Select the ESPHome device running this project's firmware.
      selector:
        device:
          filter:
            integration: esphome
    navigation_settings:
      name: Navigation
      icon: mdi:view-dashboard
      collapsed: true
      input:
        navigation_layout:
          name: Menu layout (columns x rows)
          description: Count Homepage too. More than four entries require 4x2 or 6x3; nine require 6x3.
          default: 2x2
          selector: &layout_selector
            select:
              options: [2x2, 4x2, 6x3]
        page_order:
          name: Page order and titles
          description: >-
            Drag rows to set menu and swipe order. Edit a row to set its page title;
            named rows display the title above the fixed page slot.
            Existing titles are not copied automatically from the legacy fields below.
            Unlisted pages follow in slot order; empty pages are always skipped.
            Add a Homepage row to reposition it; without one it comes first when enabled.
          default:
            - page: home
              title: Homepage
            - page: "1"
            - page: "2"
            - page: "3"
            - page: "4"
            - page: "5"
            - page: "6"
            - page: "7"
            - page: "8"
          selector:
            object:
              multiple: true
              label_field: title
              description_field: page
              fields:
                title:
                  label: Page title
                  selector:
                    text:
                page:
                  label: Page slot
                  required: true
                  selector:
                    select:
                      options:
                        - {label: Homepage, value: home}
                        - {label: Page 1, value: "1"}
                        - {label: Page 2, value: "2"}
                        - {label: Page 3, value: "3"}
                        - {label: Page 4, value: "4"}
                        - {label: Page 5, value: "5"}
                        - {label: Page 6, value: "6"}
                        - {label: Page 7, value: "7"}
                        - {label: Page 8, value: "8"}
    appearance_settings:
      name: Appearance
      icon: mdi:palette
      collapsed: true
      input:
        reverse_active:
          name: Reverse active state
          description: White normally means ON/enabled, or unlocked for locks. Selected entities invert only this appearance rule, never the action.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: [light, switch, automation, lock]
    light_detail_settings:
      name: Light details
      icon: mdi:lightbulb
      collapsed: true
      input:
        light_details:
          name: Related controls
          description: >-
            Hold a light icon to open details. Add a row to show up to two related
            light/switch/automation controls there, without main-page tiles.
            Rows for lights outside active page layouts remain saved but unused.
          default: []
          selector:
            object:
              multiple: true
              label_field: light
              fields:
                light:
                  label: Primary light
                  required: true
                  selector:
                    entity:
                      filter:
                        domain: light
                related_1:
                  label: Related entity 1
                  selector: &related_selector
                    entity:
                      filter:
                        domain: [light, switch, automation]
                related_1_title:
                  label: Related title 1 (optional)
                  selector:
                    text:
                related_2:
                  label: Related entity 2
                  selector: *related_selector
                related_2_title:
                  label: Related title 2 (optional)
                  selector:
                    text:
    homepage_settings:
      name: Homepage
      icon: mdi:home
      collapsed: true
      input:
        homepage_enabled:
          name: Enable Homepage
          description: Adds a placeholder Homepage in addition to the eight button pages.
          default: false
          selector:
            boolean:
    localization_settings:
      name: Date and time
      icon: mdi:calendar-clock
      collapsed: true
      input:
        time_format:
          name: Time format
          default: 24h
          selector:
            select:
              options:
                - {label: "24 hour (18:30)", value: 24h}
                - {label: "12 hour (06:30 PM)", value: 12h}
        date_format:
          name: Date format
          description: Weekday and month names are English.
          default: long
          selector:
            select:
              options:
                - {label: "Weekday, day month year", value: long}
                - {label: "Weekday, DD/MM", value: weekday_short}
                - {label: "DD/MM/YYYY", value: dmy}
                - {label: "MM/DD/YYYY", value: mdy}
                - {label: "YYYY-MM-DD", value: iso}
                - {label: "Day abbreviated-month year", value: abbreviated}
    wake_settings:
      name: Wake sensors
      icon: mdi:motion-sensor
      collapsed: true
      input:
        wake_sensors:
          name: Wake-up sensors
          description: >-
            Wake on OFF to ON and stay awake while any selected sensor is ON.
            Manual Sleep or backlight off takes priority until a fresh activation or touch.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: binary_sensor
    screensaver_settings:
      name: Screensaver
      icon: mdi:monitor-screenshot
      collapsed: true
      input:
        screensaver_enabled:
          name: Enable screensaver
          description: Show a full-screen clock and date after the device's Screensaver time. First touch wakes only.
          default: false
          selector:
            boolean:
    page_1:
      name: Button page 01
      icon: mdi:gesture-tap-button
      description: Leave all button entities empty to hide this page.
      collapsed: true
      input:
        page_1_layout:
          name: Layout (columns x rows)
          description: Select capacity. Higher-numbered inputs remain saved but are ignored with a warning.
          default: 2x2
          selector: *layout_selector
        page_1_icon:
          name: Page icon
          description: MDI icon shown beside the page name in navigation. Blank uses a dashboard icon.
          default: ""
          selector:
            icon:
        page_1_title:
          name: Legacy page title
          description: &legacy_page_title Existing automations only. Edit titles in Navigation > Page order and titles instead. Used when that row has no title field.
          default: ""
          selector:
            text:
        page_1_temperature:
          name: Temperature sensor
          default: []
          selector: &temperature_selector
            entity:
