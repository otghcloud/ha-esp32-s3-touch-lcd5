  endpoint: >-
    {% set ns = namespace(value='') %}
    {% for entity in device_entities(panel_device) %}
      {% set value = states(entity) %}
      {% if entity.startswith('sensor.') and value.startswith('esphome.') and value.endswith('_set_dashboard') %}
        {% set ns.value = value %}
      {% endif %}
    {% endfor %}
    {{ ns.value }}
  watched_entities: >-
    {% set ns = namespace(entities=[]) %}
    {% for entity in temperatures %}
      {% if entity is string and entity %}
        {% set ns.entities = ns.entities + [entity] %}
      {% endif %}
    {% endfor %}
    {% for p in range(8) %}
      {% set capacity = {'2x2': 4, '4x2': 8, '6x3': 18}[layouts[p]] %}
      {% for entity in buttons[p][:capacity] %}
        {% if entity is string and entity %}
          {% set ns.entities = ns.entities + [entity] %}
        {% endif %}
      {% endfor %}
    {% endfor %}
    {{ ns.entities }}
  ignored_slots: >-
    {% set ns = namespace(slots=[]) %}
    {% for p in range(8) %}
      {% set capacity = {'2x2': 4, '4x2': 8, '6x3': 18}[layouts[p]] %}
      {% for entity in buttons[p][capacity:] %}
        {% if entity is string and entity %}
          {% set ns.slots = ns.slots + ['Page ' ~ (p + 1) ~ ' button ' ~ (capacity + loop.index)] %}
        {% endif %}
      {% endfor %}
    {% endfor %}
    {{ ns.slots }}
  configuration_error: >-
    {% set ns = namespace(pages=0) %}
    {% for p in range(8) %}
      {% set active = namespace(count=0) %}
      {% set capacity = {'2x2': 4, '4x2': 8, '6x3': 18}[layouts[p]] %}
      {% for entity in buttons[p][:capacity] %}
        {% if entity is string and entity %}
          {% set active.count = active.count + 1 %}
        {% endif %}
      {% endfor %}
      {% if active.count > 0 %}
        {% set ns.pages = ns.pages + 1 %}
      {% endif %}
    {% endfor %}
    {{ 'More than four populated pages require a 4x2 or 6x3 navigation layout.' if ns.pages > 4 and navigation_layout == '2x2' else '' }}

triggers:
  - trigger: homeassistant
    event: start
    id: start
  - trigger: time_pattern
    seconds: "/30"
    id: refresh
  - trigger: event
    event_type: esphome.wallpanel_ready
    id: ready
  - trigger: event
    event_type: state_changed
    id: state

conditions:
  - condition: template
    value_template: >-
      {{ trigger is not defined
         or trigger.id in ['start', 'refresh']
         or (trigger.id == 'ready' and trigger.event.data.get('endpoint') == endpoint)
         or (trigger.id == 'state' and
             (trigger.event.data.entity_id in watched_entities
              or trigger.event.data.entity_id in device_entities(panel_device))) }}

actions:
  - choose:
      - conditions: "{{ endpoint == '' }}"
        sequence:
          - action: system_log.write
            data:
              level: warning
              message: >-
                Wallpanel configuration: selected device has no available Dashboard endpoint sensor.
                Check the firmware, ESPHome connection and that the diagnostic sensor is enabled.
      - conditions: "{{ configuration_error != '' }}"
        sequence:
          - action: system_log.write
            data:
              level: error
              message: "Wallpanel configuration unchanged: {{ configuration_error }}"
    default:
      - if: "{{ ignored_slots | length > 0 }}"
        then:
          - action: system_log.write
            data:
              level: warning
              message: >-
                Wallpanel: ignoring slots outside the selected page layouts:
                {{ ignored_slots | join(', ') }}. These inputs remain saved.
      - variables:
          dashboard_snapshot: >-
            {% set ns = namespace(pages=[]) %}
            {% for p in range(8) %}
              {% set row = namespace(buttons=[]) %}
              {% set capacity = {'2x2': 4, '4x2': 8, '6x3': 18}[layouts[p]] %}
              {% for entity in buttons[p][:capacity] %}
                {% if entity is string and entity %}
                  {% set custom_title = button_titles[p][loop.index0] | trim %}
                  {% set name = (custom_title or state_attr(entity, 'friendly_name') or entity)[:80] %}
                  {% set state = states(entity)[:40] %}
                  {% set icon = state_attr(entity, 'icon') or '' %}
                  {% if not icon and state in ['on', 'off'] and entity.startswith('switch.') and state_attr(entity, 'device_class') == 'outlet' %}
                    {% set icon = 'mdi:power-plug-off' if state == 'off' else 'mdi:power-plug' %}
                  {% endif %}
                  {% set row.buttons = row.buttons + [dict(entity=entity, name=name, state=state, icon=icon)] %}
                {% else %}
                  {% set row.buttons = row.buttons + [dict(entity='', name='', state='')] %}
                {% endif %}
              {% endfor %}
              {% set temp = temperatures[p] %}
              {% set text = '' %}
              {% if temp is string and temp %}
                {% if is_number(states(temp)) %}
                  {% set unit = state_attr(temp, 'unit_of_measurement') or '' %}
                  {% set text = 'Temperature: %.1f %s' | format(states(temp) | float, unit) %}
                {% else %}
                  {% set text = 'Temperature: UNAVAILABLE' %}
                {% endif %}
              {% endif %}
              {% set title = (titles[p] | trim)[:80] or ('Page ' ~ (p + 1)) %}
              {% set ns.pages = ns.pages + [dict(title=title, icon=page_icons[p], layout=layouts[p], temperature=text[:80], buttons=row.buttons)] %}
            {% endfor %}
            {{ dict(version=2, navigation_layout=navigation_layout, screensaver_enabled=screensaver_enabled, pages=ns.pages) }}
          transfer: "{{ now().isoformat() }}"
      - repeat:
          count: "{{ (((dashboard_snapshot | to_json) | length) + 4095) // 4096 }}"
          sequence:
            - action: "{{ endpoint ~ '_chunk' }}"
              data:
                transfer: "{{ transfer }}"
                index: "{{ repeat.index - 1 }}"
                total: "{{ (((dashboard_snapshot | to_json) | length) + 4095) // 4096 }}"
                # The prefix prevents HA from interpreting a complete JSON fragment as a native object.
                payload: "~{{ (dashboard_snapshot | to_json)[(repeat.index - 1) * 4096 : repeat.index * 4096] }}"
