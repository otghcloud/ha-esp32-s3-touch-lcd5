    - [!input page_7_button_1_title, !input page_7_button_2_title, !input page_7_button_3_title, !input page_7_button_4_title, !input page_7_button_5_title, !input page_7_button_6_title, !input page_7_button_7_title, !input page_7_button_8_title, !input page_7_button_9_title, !input page_7_button_10_title, !input page_7_button_11_title, !input page_7_button_12_title, !input page_7_button_13_title, !input page_7_button_14_title, !input page_7_button_15_title, !input page_7_button_16_title, !input page_7_button_17_title, !input page_7_button_18_title]
