  endpoint: >-
    {% set ns = namespace(value='') %}
    {% for entity in device_entities(panel_device) %}
      {% set value = states(entity) %}
      {% if entity.startswith('sensor.') and value.startswith('esphome.') and value.endswith('_set_dashboard_chunk') %}
        {% set ns.value = value %}
      {% endif %}
    {% endfor %}
    {{ ns.value }}
  effective_pages: >-
    {% set ns = namespace(pages=[]) %}
    {% for p in range(8) %}
      {% set slots = namespace(occupied=[], active=[]) %}
      {% for entity in buttons[p] %}
        {% if entity is string and entity %}
          {% set slots.occupied = slots.occupied + [loop.index0] %}
        {% endif %}
      {% endfor %}
      {% set required = (slots.occupied | length) if page_compact[p] else ((slots.occupied | last) + 1 if slots.occupied else 0) %}
      {% set layout = ('2x2' if required <= 4 else '4x2' if required <= 8 else '6x3') if layouts[p] == 'auto' else layouts[p] %}
      {% set capacity = {'2x2': 4, '4x2': 8, '6x3': 18}.get(layout, 0) %}
      {% for slot in slots.occupied %}
        {% if page_enabled[p] and (slot < capacity or (layouts[p] == 'auto' and page_compact[p])) %}
          {% set slots.active = slots.active + [slot] %}
        {% endif %}
      {% endfor %}
      {% set ns.pages = ns.pages + [dict(layout=layout, capacity=capacity, slots=slots.active)] %}
    {% endfor %}
    {{ ns.pages }}
  watched_entities: >-
    {% set ns = namespace(entities=wake_sensors | list) %}
    {% if release_sensor is string and release_sensor %}
      {% set ns.entities = ns.entities + [release_sensor] %}
    {% endif %}
    {% for p in range(8) %}
      {% if effective_pages[p].slots and temperatures[p] is string and temperatures[p] %}
        {% set ns.entities = ns.entities + [temperatures[p]] %}
      {% endif %}
      {% for slot in effective_pages[p].slots %}
        {% set ns.entities = ns.entities + [buttons[p][slot]] %}
      {% endfor %}
    {% endfor %}
    {% set active = ns.entities | list %}
    {% for row in (light_details if light_details is sequence and light_details is not string and light_details is not mapping else []) if row is mapping and row.get('light') in active %}
      {% for key in ['related_1', 'related_2'] %}
        {% set entity = row.get(key, '') %}
        {% if entity is string and entity and entity not in ns.entities %}
          {% set ns.entities = ns.entities + [entity] %}
        {% endif %}
      {% endfor %}
    {% endfor %}
    {{ ns.entities }}
  ignored_slots: >-
    {% set ns = namespace(slots=[]) %}
    {% for p in range(8) %}
      {% set capacity = effective_pages[p].capacity %}
      {% for entity in buttons[p][capacity:] if page_enabled[p] and layouts[p] != 'auto' %}
        {% if entity is string and entity %}
          {% set ns.slots = ns.slots + ['Page ' ~ (p + 1) ~ ' button ' ~ (capacity + loop.index)] %}
        {% endif %}
      {% endfor %}
    {% endfor %}
    {{ ns.slots }}
  configuration_error: >-
    {% set ns = namespace(pages=1 if homepage_enabled else 0, seen=[], error='') %}
    {% if light_details is not sequence or light_details is string or light_details is mapping %}
      {% set ns.error = 'Light details must be a list.' %}
    {% else %}
      {% set detail_rows = namespace(seen=[]) %}
      {% for row in light_details %}
        {% if row is not mapping or row.get('light') is not string or not row.light.startswith('light.') %}
          {% set ns.error = 'Each light-detail row must select a light.' %}
        {% elif row.light in detail_rows.seen %}
          {% set ns.error = 'Duplicate primary light in related controls.' %}
        {% else %}
          {% set detail_rows.seen = detail_rows.seen + [row.light] %}
          {% set related = namespace(seen=[]) %}
          {% for key in ['related_1', 'related_2'] %}
            {% set entity = row.get(key, '') %}
            {% if entity not in ['', none, []] %}
              {% if entity is not string or entity.split('.')[0] not in ['light', 'switch', 'automation'] or '.' not in entity %}
                {% set ns.error = 'Related controls support only lights, switches and automations.' %}
              {% elif entity == row.light or entity in related.seen %}
                {% set ns.error = 'Related entities must be distinct and different from the primary light.' %}
              {% endif %}
              {% set related.seen = related.seen + [entity] %}
            {% endif %}
            {% if row.get(key ~ '_title', '') is not string %}
              {% set ns.error = 'Related titles must be text.' %}
            {% endif %}
          {% endfor %}
        {% endif %}
      {% endfor %}
    {% endif %}
    {% if page_order is not sequence or page_order is string or page_order is mapping %}
      {% set ns.error = 'Page order must be a list of page rows.' %}
    {% else %}
      {% for item in page_order %}
        {% if item is not mapping or item.get('page') not in ['home', '1', '2', '3', '4', '5', '6', '7', '8'] %}
          {% set ns.error = 'Every page order row must select Homepage or a page slot from 1 to 8.' %}
        {% elif item.page in ns.seen %}
          {% set ns.error = 'Page order cannot contain the same page slot more than once.' %}
        {% elif 'title' in item and item.title is not string %}
          {% set ns.error = 'Page titles must be text.' %}
        {% else %}
          {% set ns.seen = ns.seen + [item.page] %}
        {% endif %}
      {% endfor %}
    {% endif %}
    {% for p in range(8) %}
      {% if page_enabled[p] is not boolean or page_compact[p] is not boolean %}
        {% set ns.error = 'Page Enabled and Compact settings must be booleans.' %}
      {% elif layouts[p] not in ['auto', '2x2', '4x2', '6x3'] %}
        {% set ns.error = 'Invalid button-page layout.' %}
      {% endif %}
      {% for slot in effective_pages[p].slots %}
        {% set tap = button_tap_actions[p][slot] %}
        {% if tap not in ['default', 'details'] %}
          {% set ns.error = 'Invalid button tap action.' %}
        {% elif tap == 'details' and not buttons[p][slot].startswith('light.') %}
          {% set ns.error = 'Open light details tap actions require a light entity.' %}
        {% endif %}
      {% endfor %}
      {% if effective_pages[p].slots %}
        {% set ns.pages = ns.pages + 1 %}
      {% endif %}
    {% endfor %}
    {{ ns.error
       or ('Invalid date/time preset.' if time_format not in ['24h', '12h'] or date_format not in ['long', 'weekday_short', 'dmy', 'mdy', 'iso', 'abbreviated'] else '')
       or ('Nine populated pages including Homepage require a 6x3 navigation layout.' if ns.pages > 8 and navigation_layout != '6x3' else '')
       or ('More than four populated pages require a 4x2 or 6x3 navigation layout.' if ns.pages > 4 and navigation_layout == '2x2' else '') }}

triggers:
  - trigger: homeassistant
    event: start
    id: start
  - trigger: time_pattern
    seconds: "/30"
    id: refresh
  - trigger: event
    event_type: esphome.wallpanel_ready
    id: ready
  - trigger: event
    event_type: state_changed
    id: state

conditions:
  - condition: template
    value_template: >-
      {{ trigger is not defined
         or trigger.id in ['start', 'refresh']
         or (trigger.id == 'ready' and trigger.event.data.get('endpoint') == endpoint)
         or (trigger.id == 'state' and
             (trigger.event.data.entity_id in watched_entities
              or trigger.event.data.entity_id in device_entities(panel_device))) }}

actions:
  - if: "{{ fresh_wake and endpoint != '' and configuration_error == '' }}"
    then:
      - action: "{{ endpoint[:-20] ~ '_wake_display' }}"
  - if: >-
      {{ trigger is not defined or trigger.id in ['start', 'ready']
         or (trigger.id == 'state' and
             (trigger.event.data.entity_id in device_entities(panel_device)
              or trigger.event.data.entity_id == release_sensor)) }}
    then:
      - if: "{{ release_notice | trim != '' }}"
        then:
          - action: persistent_notification.create
            data:
              notification_id: "wallpanel_release_{{ panel_device }}"
              title: Wallpanel release check
              message: "{{ release_notice | trim }}"
        else:
          - action: persistent_notification.dismiss
            data:
              notification_id: "wallpanel_release_{{ panel_device }}"
  - choose:
      - conditions: "{{ endpoint == '' }}"
        sequence:
          - action: system_log.write
            data:
              level: warning
              message: >-
                Wallpanel configuration: selected device has no available Dashboard endpoint sensor.
                Check the firmware, ESPHome connection and that the diagnostic sensor is enabled.
      - conditions: "{{ configuration_error != '' }}"
        sequence:
          - action: system_log.write
            data:
              level: error
              message: "Wallpanel configuration unchanged: {{ configuration_error }}"
    default:
      - if: "{{ ignored_slots | length > 0 }}"
        then:
          - action: system_log.write
            data:
              level: warning
              message: >-
                Wallpanel: ignoring slots outside the selected page layouts:
                {{ ignored_slots | join(', ') }}. These inputs remain saved.
      - variables:
          dashboard_snapshot: >-
            {% set ns = namespace(pages=[], order=[], home_position=0, home_title='Homepage', hold=false,
                                  lights=[], related=[], seen_lights=[], seen_related=[]) %}
            {% for item in page_order %}
              {% if item.page == 'home' %}
                {% set ns.home_position = ns.order | length %}
                {% set ns.home_title = ((item.get('title', '') | trim)[:80]) or 'Homepage' %}
              {% else %}
                {% set ns.order = ns.order + [(item.page | int) - 1] %}
              {% endif %}
            {% endfor %}
            {% for p in range(8) %}
              {% if p not in ns.order %}
                {% set ns.order = ns.order + [p] %}
              {% endif %}
            {% endfor %}
            {% for p in range(8) %}
              {% set row = namespace(buttons=[]) %}
              {% for entity in buttons[p] %}
                {% if loop.index0 in effective_pages[p].slots %}
                  {% set custom_title = button_titles[p][loop.index0] | trim %}
                  {% set name = (custom_title or state_attr(entity, 'friendly_name') or entity)[:80] %}
                  {% set state = states(entity)[:40] %}
                  {% set icon = state_attr(entity, 'icon') or '' %}
                  {% if not icon and state in ['on', 'off'] and entity.startswith('switch.') and state_attr(entity, 'device_class') == 'outlet' %}
                    {% set icon = 'mdi:power-plug-off' if state == 'off' else 'mdi:power-plug' %}
                  {% endif %}
                  {% set row.buttons = row.buttons + [dict(entity=entity, name=name, state=state, icon=icon, tap_action=button_tap_actions[p][loop.index0])] %}
                {% else %}
                  {% set row.buttons = row.buttons + [dict(entity='', name='', state='', icon='', tap_action='default')] %}
                {% endif %}
              {% endfor %}
              {% set temp = temperatures[p] %}
              {% set text = '' %}
              {% if effective_pages[p].slots and temp is string and temp %}
                {% if is_number(states(temp)) %}
                  {% set unit = state_attr(temp, 'unit_of_measurement') or '' %}
                  {% set text = ('%.1f %s' | format(states(temp) | float, unit)) | trim %}
                {% else %}
                  {% set text = 'UNAVAILABLE' %}
                {% endif %}
              {% endif %}
              {% set title_input = namespace(value='') %}
              {% for item in page_order %}
                {% if item.page == ((p + 1) | string) and item.title is defined %}
                  {% set title_input.value = item.title %}
                {% endif %}
              {% endfor %}
              {% set title = (title_input.value | trim)[:80] or ('Page ' ~ (p + 1)) %}
              {% set ns.pages = ns.pages + [dict(title=title, icon=page_icons[p], layout=effective_pages[p].layout, compact=page_compact[p], temperature=text[:80], buttons=row.buttons)] %}
            {% endfor %}
            {% for entity in wake_sensors %}
              {% if states(entity) == 'on' %}
                {% set ns.hold = true %}
              {% endif %}
            {% endfor %}
            {% for page in ns.pages %}
              {% for button in page.buttons if button.entity.startswith('light.') and button.entity not in ns.seen_lights %}
                {% set entity = button.entity %}
                {% set ns.seen_lights = ns.seen_lights + [entity] %}
                {% set raw_modes = state_attr(entity, 'supported_color_modes') or [] %}
                {% set modes = (raw_modes if raw_modes is sequence and raw_modes is not string else []) | select('in', ['onoff', 'brightness', 'color_temp', 'hs', 'xy', 'rgb', 'rgbw', 'rgbww', 'white']) | list %}
                {% set colour_mode = state_attr(entity, 'color_mode') %}
                {% set dimmable = modes | select('in', ['brightness', 'color_temp', 'hs', 'xy', 'rgb', 'rgbw', 'rgbww', 'white']) | list | length > 0 %}
                {% set colour = modes | select('in', ['hs', 'xy', 'rgb', 'rgbw', 'rgbww']) | list | length > 0 %}
                {% set low = state_attr(entity, 'min_color_temp_kelvin') %}
                {% set high = state_attr(entity, 'max_color_temp_kelvin') %}
                {% set temperature = 'color_temp' in modes and is_number(low) and is_number(high) and 0 < (low | float) < (high | float) <= 100000 %}
                {% set brightness = state_attr(entity, 'brightness') %}
                {% set kelvin = state_attr(entity, 'color_temp_kelvin') %}
                {% set hs = state_attr(entity, 'hs_color') %}
                {% set hs_valid = hs is sequence and hs is not string and hs | length == 2 and is_number(hs[0]) and is_number(hs[1]) and 0 <= (hs[0] | float) <= 360 and 0 <= (hs[1] | float) <= 100 %}
                {% set binding = namespace(refs=[], titles=[]) %}
                {% for row in light_details if row.light == entity %}
                  {% for key in ['related_1', 'related_2'] %}
                    {% set related = row.get(key, '') %}
                    {% if related is string and related %}
                      {% set binding.refs = binding.refs + [related] %}
                      {% set binding.titles = binding.titles + [(row.get(key ~ '_title', '') | trim)[:80]] %}
                      {% if related not in ns.seen_related %}
                        {% set ns.seen_related = ns.seen_related + [related] %}
                        {% set ns.related = ns.related + [dict(entity=related,
                            name=(state_attr(related, 'friendly_name') or related)[:80],
                            state=states(related)[:40], icon=state_attr(related, 'icon') or '')] %}
                      {% endif %}
                    {% endif %}
                  {% endfor %}
                {% endfor %}
                {% set ns.lights = ns.lights + [dict(entity=entity, known=modes | length > 0,
                    colour_mode=colour_mode if colour_mode in modes else '',
                    dimmable=dimmable, colour=colour, temperature=temperature,
                    temperature_issue='color_temp' in modes and not temperature,
                    brightness=(brightness | int) if is_number(brightness) and 0 <= (brightness | float) <= 255 else -1,
                    kelvin=(kelvin | int) if temperature and is_number(kelvin) and (low | float) <= (kelvin | float) <= (high | float) else -1,
                    min_kelvin=(low | int) if temperature else 0, max_kelvin=(high | int) if temperature else 0,
                    hue=(hs[0] | float) if hs_valid else -1, saturation=(hs[1] | float) if hs_valid else -1,
                    related=binding.refs, related_titles=binding.titles)] %}
              {% endfor %}
            {% endfor %}
            {{ dict(version=3, blueprint_release=blueprint_release, latest_release=latest_release,
                    navigation_layout=navigation_layout, screensaver_enabled=screensaver_enabled,
                    homepage=dict(enabled=homepage_enabled, position=ns.home_position, title=ns.home_title),
                    localization=dict(time=time_format, date=date_format), wake_hold=ns.hold,
                    reverse_active=reverse_active, light_details=ns.lights, detail_entities=ns.related,
                    page_order=ns.order, pages=ns.pages) }}
          transfer: "{{ now().isoformat() }}"
      - repeat:
          count: "{{ ((((dashboard_snapshot | to_json(ensure_ascii=True)) | length) + 4095) // 4096) if (dashboard_snapshot | to_json(ensure_ascii=True)) | length <= 262144 else 0 }}"
          sequence:
            - action: "{{ endpoint }}"
              data:
                transfer: "{{ transfer }}"
                index: "{{ repeat.index - 1 }}"
                total: "{{ (((dashboard_snapshot | to_json(ensure_ascii=True)) | length) + 4095) // 4096 }}"
                # The prefix prevents HA from interpreting a complete JSON fragment as a native object.
                payload: "~{{ (dashboard_snapshot | to_json(ensure_ascii=True))[(repeat.index - 1) * 4096 : repeat.index * 4096] }}"
      - if: "{{ (dashboard_snapshot | to_json(ensure_ascii=True)) | length > 262144 }}"
        then:
          - action: system_log.write
            data:
              level: error
              message: "Wallpanel configuration unchanged: rich dashboard exceeds 256 KiB. Shorten labels or reduce related controls."
