mode: restart
max_exceeded: silent

variables:
  panel_device: !input panel_device
  blueprint_release: "0.0.1"
  release_sensor: !input release_sensor
  firmware_release: >-
    {% set ns = namespace(value='') %}
    {% for entity in device_entities(panel_device) %}
      {% set value = states(entity) %}
      {% if entity.startswith('sensor.') and value.startswith('wallpanel/') %}
        {% set ns.value = value[10:] %}
      {% endif %}
    {% endfor %}
    {{ ns.value }}
  latest_release: >-
    {% set candidate = states(release_sensor) if release_sensor is string and release_sensor else '' %}
    {{ candidate if candidate | regex_match('^(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$')
       and (candidate.split('.') | map('int') | max) <= 4294967295 else '' }}
  release_notice: >-
    {% if firmware_release and firmware_release != blueprint_release %}
      Wallpanel firmware {{ firmware_release }} does not match blueprint {{ blueprint_release }}.
      Install firmware and blueprint from the same release.
    {% endif %}
    {% if latest_release and version(latest_release) > version(blueprint_release) %}
      Wallpanel {{ latest_release }} is available. Review its release notes and update both firmware and blueprint:
      https://github.com/otghcloud/ha-esp32-s3-touch-lcd5/releases/latest
    {% endif %}
  reverse_active: !input reverse_active
  light_details: !input light_details
  screensaver_enabled: !input screensaver_enabled
  homepage_enabled: !input homepage_enabled
  time_format: !input time_format
  date_format: !input date_format
  wake_sensors: !input wake_sensors
  fresh_wake: >-
    {{ trigger is defined and trigger.id == 'state'
       and trigger.event.data.entity_id in wake_sensors
       and trigger.event.data.old_state is not none
       and trigger.event.data.new_state is not none
       and trigger.event.data.old_state.state == 'off'
       and trigger.event.data.new_state.state == 'on' }}
  page_order: !input page_order
  temperatures:
    - !input page_1_temperature
    - !input page_2_temperature
    - !input page_3_temperature
    - !input page_4_temperature
    - !input page_5_temperature
    - !input page_6_temperature
    - !input page_7_temperature
    - !input page_8_temperature
