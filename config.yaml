pages:
  - id: office
    title: Office
    temperature:
      entity_id: sensor.office_nspanel_temperature
      label: "Temperature: %.1f C"
    controls:
      - id: lamp
        label: Lamp
        type: light
        entity_id: light.office_lamp
        icon: mdi:lightbulb
      - id: ceiling
        label: Ceiling
        type: light
        entity_id: light.office_ceiling
        icon: mdi:ceiling-light
      - id: cupboard
        label: Cupboard
        type: light
        entity_id: light.office_cupboard_light
        icon: mdi:lightbulb-group-outline
      - id: door
        label: Door
        type: lock
        entity_id: lock.office_office_door
        icon: mdi:door

  - id: landing
    title: Landing
    temperature:
      entity_id: sensor.landing_nspanel_temperature
      label: "Temperature: %.1f C"
    controls:
      - id: landing_light
        label: Landing Light
        type: light
        entity_id: light.landing_light
        icon: mdi:lightbulb
      - id: landing_lighting
        label: Landing Lighting
        type: automation
        entity_id: automation.lighting_landing
        icon: mdi:robot
